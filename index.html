<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>DERU — Fiyat Optimizasyon Motoru</title>
<style>
  :root{
    --ink:#231916;
    --paper:#ffffff;
    --rose:#c96b7d;
    --rose-deep:#8a3f52;
    --blush:#faf1ef;
    --line:#ece3e0;
    --muted:#9a8a85;
    --shadow:0 4px 18px rgba(35,25,22,0.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:50px;
  }
  .wrap{max-width:520px;margin:0 auto;padding:26px 18px 60px;}

  header{text-align:center;margin-bottom:20px;}
  header h1{
    font-size:40px;
    font-weight:800;
    letter-spacing:0.02em;
    margin:0;
    color:var(--ink);
  }
  header .sub{
    font-size:12.5px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--muted);
    margin-top:4px;
  }

  .card{
    background:var(--paper);
    border-radius:20px;
    box-shadow:var(--shadow);
    padding:20px;
    margin-bottom:18px;
  }

  .total-card{
    background:var(--rose);
    border-radius:20px;
    padding:22px 22px;
    color:#fff;
    margin-bottom:20px;
    box-shadow:var(--shadow);
  }
  .total-card .label{
    font-size:12px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    opacity:0.85;
  }
  .total-card .amount{
    font-size:38px;
    font-weight:800;
    margin-top:4px;
    line-height:1;
  }
  .total-card .amount span{font-size:18px;font-weight:500;opacity:0.85;}

  h2.section-title{
    font-size:12px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 12px;
    font-weight:700;
  }

  .product-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:11px 0;
    border-bottom:1px solid var(--line);
    gap:10px;
  }
  .product-row:last-child{border-bottom:none;}
  .product-row .info{flex:1;min-width:0;}
  .product-row .name{font-size:14.5px;font-weight:600;}
  .product-row .price{font-size:12px;color:var(--muted);margin-top:1px;}

  .stepper{
    display:flex;
    align-items:center;
    background:var(--blush);
    border-radius:12px;
    overflow:hidden;
    flex-shrink:0;
  }
  .stepper button{
    width:36px;height:36px;
    border:none;
    background:transparent;
    font-size:18px;
    color:var(--rose-deep);
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .stepper button:active{background:rgba(201,107,125,0.18);}
  .stepper .qty{
    width:32px;
    text-align:center;
    font-size:14.5px;
    font-weight:700;
  }

  .result-line{
    display:flex;justify-content:space-between;
    padding:6px 0;
    font-size:13.5px;
  }
  .result-line.sub{color:var(--muted);font-size:12px;padding-left:12px;}
  .result-line.head{
    font-size:11.5px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--rose-deep);
    font-weight:700;
    margin-top:12px;
    padding-bottom:4px;
  }
  .result-line.head:first-child{margin-top:0;}
  .dashed{border-top:1px dashed var(--line);margin:10px 0;}
  .grand{
    display:flex;justify-content:space-between;
    font-size:17px;font-weight:800;
    color:var(--rose-deep);
    padding-top:4px;
  }
  .empty-msg{color:var(--muted);text-align:center;font-size:13.5px;padding:8px 0;}

  .msg-box{
    white-space:pre-wrap;
    background:var(--blush);
    border-radius:14px;
    padding:16px;
    font-size:13.5px;
    line-height:1.7;
    color:var(--ink);
  }

  .btn-row{
    display:flex;
    gap:10px;
    margin-top:14px;
  }
  .btn{
    flex:1;
    border:none;
    border-radius:12px;
    padding:12px 10px;
    font-size:13.5px;
    font-weight:700;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .btn-primary{background:var(--rose);color:#fff;}
  .btn-secondary{background:var(--blush);color:var(--rose-deep);}
  .btn:active{opacity:0.85;}

  .quick-card-title{
    font-size:15px;
    font-weight:700;
    margin-bottom:12px;
  }
  .quick-btn-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .quick-btn{
    flex:1;
    min-width:130px;
    border:none;
    border-radius:14px;
    padding:16px 10px;
    font-size:14px;
    font-weight:700;
    background:var(--blush);
    color:var(--rose-deep);
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .quick-btn:active{background:rgba(201,107,125,0.2);}

  /* ---- Yurtdışı toggle ---- */
  .locale-card{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .locale-card .locale-label{
    font-size:15px;
    font-weight:700;
  }
  .switch{
    position:relative;width:50px;height:29px;
    background:var(--line);border-radius:20px;
    cursor:pointer;flex-shrink:0;
    transition:background .15s;
  }
  .switch.on{background:var(--rose);}
  .switch .knob{
    position:absolute;top:3px;left:3px;
    width:23px;height:23px;border-radius:50%;
    background:#fff;
    transition:left .15s;
    box-shadow:0 1px 2px rgba(0,0,0,0.2);
  }
  .switch.on .knob{left:24px;}

  /* ---- İndirim / Ek Hizmet form alanları ---- */
  .field-row{
    display:flex;
    gap:8px;
    margin-bottom:8px;
  }
  .field-row:last-child{margin-bottom:0;}
  .field-input{
    flex:1;
    border:1px solid var(--line);
    background:var(--blush);
    border-radius:10px;
    padding:10px 12px;
    font-size:13.5px;
    color:var(--ink);
    font-family:inherit;
    min-width:0;
  }
  .field-input.amount{flex:0 0 110px;}
  .field-input:focus{outline:2px solid var(--rose);outline-offset:-1px;}

  .extra-row{
    display:flex;
    gap:8px;
    align-items:center;
    margin-bottom:8px;
  }
  .extra-row .field-input{margin-bottom:0;}
  .extra-remove{
    flex-shrink:0;
    width:36px;height:36px;
    border:none;
    border-radius:10px;
    background:var(--blush);
    color:var(--rose-deep);
    font-size:16px;
    font-weight:700;
    cursor:pointer;
  }
  .extra-add-btn{
    width:100%;
    border:1px dashed var(--rose);
    background:transparent;
    color:var(--rose-deep);
    border-radius:10px;
    padding:10px;
    font-size:13.5px;
    font-weight:700;
    cursor:pointer;
    margin-top:2px;
  }

  .toast{
    position:fixed;
    left:50%;bottom:24px;
    transform:translateX(-50%) translateY(20px);
    background:var(--ink);
    color:#fff;
    padding:10px 18px;
    border-radius:30px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s, transform .2s;
    z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media print{
    .no-print{display:none !important;}
    body{padding:0;}
    .total-card{background:#fff !important;color:var(--ink) !important;box-shadow:none;border:1px solid var(--line);}
    .card{box-shadow:none;border:1px solid var(--line);}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>

    <div class="quick-btn-row">

  </div>

  <div class="card no-print">
    <div class="quick-card-title" id="txtQuickCard2">🧸 Teddy Setleri</div>

  </div>

  <div class="card no-print">
    <div class="quick-card-title" id="txtQuickCard3">🪮 Tarak Setleri</div>

      <button class="quick-btn" id="qsTarakSeti">➕ Tarak Seti</button>
    </div>
  </div>

  <div class="card no-print">
    <h2 class="section-title" id="txtUrunlerTitle">Ürünler</h2>
    <div id="productList"></div>
  </div>

  <div class="card no-print">
    <h2 class="section-title" id="txtIndirimTitle">🏷️ İndirim</h2>
    <div class="field-row">
      <input type="text" class="field-input" id="discountDesc" placeholder="Açıklama (örn. Kampanya)">

  <div class="card">
    <h2 class="section-title" id="txtFiyatDokumuTitle">Fiyat Dökümü</h2>
    <div id="resultBox"></div>
  </div>

  <div class="card">
    <h2 class="section-title" id="txtMusteriMesajiTitle">Müşteri Mesajı</h2>
    <div class="msg-box" id="msgBox"></div>
    <div class="btn-row no-print">
      <button class="btn btn-primary" id="btnCopy">Kopyala</button>
      <button class="btn btn-secondary" id="btnPrint">Yazdır</button>
    </div>
  </div>

  <div class="btn-row no-print">
    <button class="btn btn-secondary" id="btnClear">Siparişi Temizle</button>
  </div>

</div>

<div class="toast" id="toast">Kopyalandı</div>

<script>
/* =========================================================
   1. VERİ YAPILARI (DATA)
   ========================================================= */

// Sabit fiyatlı, doğrudan çarpılan ürünler
const PRICES = {
  tavsan: 600,
  yaka: 200,
  ciftYaka: 300,
  buyukSapka: 350,
  teddy: 800,
  keciKiliTarak: 720,

  harfMagnet: null, // özel kademeli fiyat sistemi (aşağıda)

};

// Ekranda gösterilecek ürün listesi (kolayca yeni ürün eklenebilir)
const PRODUCTS = [
  { id: 'tavsan',        name: 'Tavşan Uyku Arkadaşı', nameEN: 'Bunny Sleep Buddy',                 price: PRICES.tavsan },
  { id: 'yaka',          name: 'İsme Özel Boyunluk',    nameEN: 'Personalized Neck Scarf',           price: PRICES.yaka },
  { id: 'ciftYaka',      name: 'Çift Kat İsme Özel Boyunluk', nameEN: 'Double-Layer Personalized Neck Scarf', price: PRICES.ciftYaka },
  { id: 'kucukSapka',    name: 'Küçük Şapka',          nameEN: 'Toy Hat',                           price: null }, // özel blok sistemi
  { id: 'buyukSapka',    name: 'Büyük Şapka',          nameEN: 'Personalized Baby Hat',             price: PRICES.buyukSapka },
  { id: 'teddy',         name: 'Teddy Uyku Arkadaşı',  nameEN: 'Teddy Sleep Buddy',                 price: PRICES.teddy },
  { id: 'keciKiliTarak', name: 'Keçi Kılı Tarak',      nameEN: 'Goat Hair Brush',                   price: PRICES.keciKiliTarak },
  { id: 'bambuTarak',    name: 'Bambu Tarak',          nameEN: 'Bamboo Brush',                      price: PRICES.bambuTarak },
  { id: 'kapiSusu',      name: 'Kapı / Duvar Süsü',    nameEN: 'Door / Wall Decor',                 price: PRICES.kapiSusu },
  { id: 'harfMagnet',    name: 'Harf Magnet',          nameEN: 'Letter Magnets',                    price: null }, // özel kademeli fiyat sistemi
  { id: 'ciftIsim',      name: 'Çift İsim',            nameEN: 'Long Double Name',                  price: PRICES.ciftIsim }

// Ana setler — her biri "requires" içinde hangi üründen kaç adet tükettiğini tanımlar.
// Yeni bir set eklemek için bu diziye bir obje eklemek yeterlidir.
const SETS = [
  { id: 'yasSeti',        name: 'Yaş / 6 Aylık Set',       nameEN: 'Bunny 1st Birthday / 6-Month Set', price: 1300, requires: { tavsan: 1, yaka: 1, kucukSapka: 1, buyukSapka: 1 },
    contentOrder: ['tavsan','buyukSapka','kucukSapka','yaka'] },
  { id: 'aylikSet',       name: '12 Aylık Set',            nameEN: 'Bunny 12-Month Keepsake Set',      price: 2400, requires: { tavsan: 1, yaka: 1, buyukSapka: 1, kucukSapka: 12 },
    contentOrder: ['tavsan','buyukSapka','kucukSapka','yaka'] },
  { id: 'teddyYasSeti',   name: 'Teddy Yaş / 6 Aylık Set', nameEN: 'Teddy 1st Birthday / 6-Month Set', price: 1600, requires: { teddy: 1, ciftYaka: 1, kucukSapka: 1, buyukSapka: 1 },
    contentOrder: ['teddy','buyukSapka','kucukSapka','ciftYaka'] },
  { id: 'teddyAylikSet',  name: 'Teddy 12 Aylık Set',      nameEN: 'Teddy 12-Month Keepsake Set',      price: 2700, requires: { teddy: 1, ciftYaka: 1, buyukSapka: 1, kucukSapka: 12 },
    contentOrder: ['teddy','buyukSapka','kucukSapka','ciftYaka'] }
];

// Müşteri mesajında setlerin gösterim önceliği (Güncelleme 20). Yalnızca görüntü sırasını belirler;
// fiyat optimizasyon motorunu veya hangi kombinasyonun seçildiğini etkilemez.
const MESSAGE_SET_DISPLAY_ORDER = ['teddyAylikSet', 'aylikSet', 'teddyYasSeti', 'yasSeti'];

// Müşteri mesajında set içeriğini okunabilir isimlerle göstermek için kullanılan eşleme.
// Sadece görüntüleme amaçlıdır — fiyatlandırmayı etkilemez.
const CONTENT_DISPLAY_NAMES = {
  tavsan: 'Tavşan Uyku Arkadaşı',
  teddy: 'Teddy Uyku Arkadaşı',
  yaka: 'İsme Özel Boyunluk',
  ciftYaka: 'Çift Kat İsme Özel Boyunluk',
  buyukSapka: 'İsimli Bebek Şapkası',
  kucukSapka: 'Oyuncak Şapkası'
};
const CONTENT_DISPLAY_NAMES_EN = {
  tavsan: 'Bunny Sleep Buddy',
  teddy: 'Teddy Sleep Buddy',
  yaka: 'Personalized Neck Scarf',
  ciftYaka: 'Double-Layer Personalized Neck Scarf',
  buyukSapka: 'Personalized Baby Hat',
  kucukSapka: 'Toy Hat'
};

// Tarak Seti için de aynı içerik gösterimi (otomatik oluşturulan setler dahil)
const TARAK_SET_CONTENT_ORDER = ['keciKiliTarak', 'bambuTarak'];
const TARAK_CONTENT_DISPLAY_NAMES = {
  keciKiliTarak: 'Keçi Kılı Tarak',
  bambuTarak: 'Bambu Tarak'
};
const TARAK_CONTENT_DISPLAY_NAMES_EN = {
  keciKiliTarak: 'Goat Hair Brush',
  bambuTarak: 'Bamboo Brush'
};

// Tarak otomatik seti (kullanıcı bunu seçmez, sistem kendisi oluşturur)
const TARAK_SET = { name: "2'li Tarak Seti", nameEN: 'Brush Set', price: 1400, requires: { keciKiliTarak: 1, bambuTarak: 1 } };

// Küçük Şapka blok içi birim fiyatlar (1..12. şapka sırasıyla)
// 1-6: 150 TL sabit / 7-11: 60 TL sabit / 12: 50 TL
const HAT_UNIT_PRICES = [150,150,150,150,150,150, 60,60,60,60,60, 50];
const HAT_BLOCK_SIZE = 12;
const HAT_BLOCK_TOTAL = HAT_UNIT_PRICES.reduce((a,b)=>a+b,0); // 1250 TL

const SABIT_MESAJ = {
  kargo: 120,
  hazirlik: '15 iş günü',
  ciftIsimNotu: 'Çift uzun isimlerde +50 TL eklenmiştir.'
};

/* =========================================================
   2. DURUM (STATE)
   ========================================================= */

let state = {};
PRODUCTS.forEach(p => state[p.id] = 0);
state.discountDesc = '';
state.discountAmount = 0;
state.extraServices = []; // [{ desc, price }]

let locale = 'tr'; // 'tr' | 'intl'

/* =========================================================
   1b. ULUSLARARASI (i18n) METİNLER
   ========================================================= */

const I18N = {
  tr: {
    subtitle: 'Fiyat Optimizasyon Motoru',
    localeLabel: '🌍 Yurtdışı Müşterisi',

    extraDescPlaceholder: 'Açıklama (örn. Nakış)',
    extraPricePlaceholder: 'TL',

    fiyatDokumuTitle: 'Fiyat Dökümü',

    emptyMsg: 'Henüz ürün seçilmedi',
    resultHeadSets: 'Kullanılan Setler',

    resultHeadDiscount: 'İndirim',
    resultHeadExtra: 'Ek Hizmet / Ek Ücret',
    subtotalLabel: 'Ara toplam',
    roundingLabel: 'Yuvarlama',
    totalLine: 'TOPLAM',
    currency: 'TL',
    toastCopied: 'Kopyalandı',
    toastCopyFail: 'Kopyalama başarısız'
  },
  intl: {

    totalLabel: 'Total Amount',
    quickCard1: '🐰 Bunny Sets',
    quickCard2: '🧸 Teddy Sets',
    quickCard3: '🪮 Brush Sets',
    quickBtnYasSeti: '➕ Bunny 1st Birthday / 6-Month Set',
    quickBtnAylikSet: '➕ Bunny 12-Month Keepsake Set',
    quickBtnTeddyYasSeti: '➕ Teddy 1st Birthday / 6-Month Set',

    btnCopy: 'Copy',
    btnPrint: 'Print',

    emptyMsg: 'No products selected yet',
    resultHeadSets: 'Sets Used',
    resultHeadAutoSets: 'Auto-Generated Sets',
    resultHeadProducts: 'Products Used',

    toastCopyFail: 'Copy failed'

};

function tr(key){ return I18N[locale][key]; }

/* =========================================================
   1c. YURTDIŞI FİYAT ÇEVRİMİ (Güncelleme 25)
   ========================================================= */

// Türkiye fiyatını yurtdışı fiyatına çevirir: (fiyat / 0.70), en yakın üst 20 TL katına yuvarlanır.
// Yalnızca GÖRÜNTÜLEME amaçlıdır — iç hesaplama TL üzerinden değişmeden devam eder.
function convertToIntl(tl){
  return Math.ceil((tl / 0.70) / 20) * 20;
}

// Her yerde fiyat göstermek için tek nokta: locale'e göre TL veya TRY döndürür.
function money(tl){
  const value = locale === 'intl' ? convertToIntl(tl) : tl;
  return `${fmt(value)} ${tr('currency')}`;
}

// Ürün/Set isimlerini locale'e göre döndürür (yalnızca görüntü; requires/price anahtarları değişmez).
function pname(id){
  const p = PRODUCTS.find(x => x.id === id);
  return locale === 'intl' ? p.nameEN : p.name;
}
function sname(idx){
  return locale === 'intl' ? SETS[idx].nameEN : SETS[idx].name;
}
function contentNames(){
  return locale === 'intl' ? CONTENT_DISPLAY_NAMES_EN : CONTENT_DISPLAY_NAMES;
}
function tarakContentNames(){
  return locale === 'intl' ? TARAK_CONTENT_DISPLAY_NAMES_EN : TARAK_CONTENT_DISPLAY_NAMES;
}
function tarakSetName(){
  return locale === 'intl' ? TARAK_SET.nameEN : TARAK_SET.name;
}

/* =========================================================
   3. KÜÇÜK ŞAPKA BLOK HESAPLAMA SİSTEMİ
   ========================================================= */

// Bir bloğun içindeki ilk k adet şapkanın toplam fiyatı (k: 0-12 arası)
function partialHatBlockCost(k){
  if (k <= 0) return 0;
  let total = 0;
  for (let i = 0; i < k; i++) total += HAT_UNIT_PRICES[i];
  return total;
}

// n adet küçük şapkanın toplam fiyatı — bloklar birbirinden bağımsızdır.
// 13. şapka yeni blok başlatır, 25. şapka yeni blok başlatır, vs.
function hatBlockCost(n){
  if (n <= 0) return 0;
  const fullBlocks = Math.floor(n / HAT_BLOCK_SIZE);
  const remainder = n % HAT_BLOCK_SIZE;
  return (fullBlocks * HAT_BLOCK_TOTAL) + partialHatBlockCost(remainder);
}

// İlk 6 harfin HER BİRİ 100 TL, 7. harften itibaren HER BİRİ 70 TL.
// Not: Küçük Şapka'nın aksine bu sistemde blok/sıfırlama yoktur — kademe tek seferde uygulanır.
function harfMagnetCost(n){
  if (n <= 0) return 0;
  if (n <= 6) return n * 100;
  return (6 * 100) + ((n - 6) * 70);
}

// Ekranda gösterim için: kaç harf ilk kademede (100 TL), kaç harf ikinci kademede (70 TL)
function harfMagnetBreakdown(n){
  const first = Math.min(n, 6);
  const extra = Math.max(n - 6, 0);
  return { first, extra, firstCost: first * 100, extraCost: extra * 70 };
}

/* =========================================================
   4. TARAK OTOMATİK SET OLUŞTURMA
   ========================================================= */

// Mümkün olan en fazla sayıda "2'li Tarak Seti" oluşturur (her set 1 keçi kılı + 1 bambu tarak).
// Bir set her zaman iki ürünü ayrı ayrı almaktan daha ucuzdur (1400 < 720+840), bu yüzden
// maksimum eşleştirme her zaman minimum fiyatı verir.
function optimizeTarakSeti(keciKiliAdet, bambuAdet){
  const setSayisi = Math.min(keciKiliAdet, bambuAdet);
  const kalanKeci = keciKiliAdet - setSayisi;
  const kalanBambu = bambuAdet - setSayisi;
  const cost = (setSayisi * TARAK_SET.price)
             + (kalanKeci * PRICES.keciKiliTarak)
             + (kalanBambu * PRICES.bambuTarak);
  return { setSayisi, kalanKeci, kalanBambu, cost };
}

/* =========================================================
   5. ANA SET OPTİMİZASYON MOTORU (Recursive Backtracking)
   ========================================================= */

// Sette yer almayan kalan ürünlerin (tavşan, yaka, çift yaka, teddy, büyük şapka, küçük şapka)
// fiyatını hesaplar. Küçük şapka için blok sistemi burada devreye girer.
function leftoverCost(inv){
  return (inv.tavsan    || 0) * PRICES.tavsan
       + (inv.yaka      || 0) * PRICES.yaka
       + (inv.ciftYaka  || 0) * PRICES.ciftYaka
       + (inv.teddy     || 0) * PRICES.teddy
       + (inv.buyukSapka|| 0) * PRICES.buyukSapka
       + hatBlockCost(inv.kucukSapka || 0);
}

// Tüm set kombinasyonlarını (SETS dizisindeki her set için 0..maksimum adet) tam arama ile dener.
// Greedy DEĞİLDİR: "en çok set" değil, "en düşük toplam fiyat" veren kombinasyon seçilir.
// Eşit fiyatlı durumlarda, setleri kullanan kombinasyon tercih edilir (döküm ekranında anlamlı olması için).
function optimizeAnaSetler(inventory){
  let best = null;
  const n = SETS.length;
  const SAFETY_CAP = 40; // gerçekçi sipariş adetleri için güvenlik sınırı

  function maxPossible(setIdx, inv){
    const req = SETS[setIdx].requires;
    let max = Infinity;
    for (const key in req) {
      max = Math.min(max, Math.floor((inv[key] || 0) / req[key]));
    }
    if (max === Infinity) max = 0;
    return Math.min(max, SAFETY_CAP);
  }

  function backtrack(idx, inv, costSoFar, counts){
    if (idx === n){
      const total = costSoFar + leftoverCost(inv);
      if (best === null || total <= best.cost){
        best = { counts: counts.slice(), cost: total, remaining: Object.assign({}, inv) };
      }
      return;
    }
    const cap = maxPossible(idx, inv);
    for (let c = 0; c <= cap; c++){
      const newInv = Object.assign({}, inv);
      const req = SETS[idx].requires;
      for (const key in req) newInv[key] -= req[key] * c;
      counts.push(c);
      backtrack(idx + 1, newInv, costSoFar + (c * SETS[idx].price), counts);
      counts.pop();
    }
  }

  backtrack(0, Object.assign({}, inventory), 0, []);
  return best;
}

/* =========================================================
   6. TOPLU OPTİMİZASYON — TÜM MOTORU BİRLEŞTİRİR
   ========================================================= */

function optimizeAll(s){
  const anaSetSonuc = optimizeAnaSetler(s);
  const tarakSonuc = optimizeTarakSeti(s.keciKiliTarak || 0, s.bambuTarak || 0);
  const kapiSusuCost = (s.kapiSusu || 0) * PRICES.kapiSusu;
  const harfMagnetTotal = harfMagnetCost(s.harfMagnet || 0);
  const ciftIsimCost = (s.ciftIsim || 0) * PRICES.ciftIsim;

  // Ek Hizmet / Ek Ücret (Güncelleme 23): kullanıcının serbestçe eklediği kalemlerin toplamı.
  const extraServices = (s.extraServices || []).filter(x => x.desc && Number(x.price) > 0);
  const extraServicesTotal = extraServices.reduce((sum, x) => sum + Number(x.price), 0);

  const rawTotal = anaSetSonuc.cost + tarakSonuc.cost + kapiSusuCost + harfMagnetTotal + ciftIsimCost + extraServicesTotal;

  // İndirim (Güncelleme 22): toplamdan düşülür, negatif toplam oluşmasına izin verilmez.
  const requestedDiscount = Math.max(0, Number(s.discountAmount) || 0);
  const appliedDiscount = Math.min(requestedDiscount, rawTotal);
  const discountDesc = (s.discountDesc || '').trim();
  const hasDiscount = appliedDiscount > 0 && discountDesc.length > 0;

  const araToplam = rawTotal - (hasDiscount ? appliedDiscount : 0);
  const finalToplam = Math.round(araToplam / 10) * 10; // yuvarlama sadece en sonda
  const kargoDahilToplam = finalToplam + SABIT_MESAJ.kargo; // sadece TR müşteri mesajında kullanılır

  return {
    anaSetSonuc,
    tarakSonuc,
    kapiSusuCost,
    harfMagnetCost: harfMagnetTotal,
    ciftIsimCost,
    extraServices,
    extraServicesTotal,
    hasDiscount,
    discountDesc,
    appliedDiscount: hasDiscount ? appliedDiscount : 0,
    rawTotal,
    araToplam,
    finalToplam,
    kargoDahilToplam
  };
}

function fmt(n){ return n.toLocaleString('tr-TR'); }

function priceLabel(p){

}

/* =========================================================
   9. RENDER — FİYAT DÖKÜMÜ
   ========================================================= */

function renderResult(result){
  const box = document.getElementById('resultBox');
  const { anaSetSonuc, tarakSonuc, kapiSusuCost, harfMagnetCost, ciftIsimCost,
          extraServices, extraServicesTotal, hasDiscount, discountDesc, appliedDiscount,
          araToplam, finalToplam } = result;

  const usedSets = anaSetSonuc.counts
    .map((c, i) => ({ c, name: sname(i), price: SETS[i].price }))
    .filter(x => x.c > 0);

  const rem = anaSetSonuc.remaining;
  const hasIndividual = (rem.tavsan || rem.yaka || rem.ciftYaka || rem.teddy || rem.buyukSapka || rem.kucukSapka
                       || tarakSonuc.kalanKeci || tarakSonuc.kalanBambu
                       || state.kapiSusu || state.harfMagnet || state.ciftIsim);

  let html = '';

  if (usedSets.length === 0 && tarakSonuc.setSayisi === 0 && !hasIndividual && extraServices.length === 0 && !hasDiscount){
    box.innerHTML = `<div class="empty-msg">${tr('emptyMsg')}</div>`;
    return;
  }

  if (usedSets.length){
    html += `<div class="result-line head">${tr('resultHeadSets')}</div>`;
    usedSets.forEach(x => {
      html += `<div class="result-line"><span>${x.c} × ${x.name}</span><span>${money(x.c * x.price)}</span></div>`;
    });
  }

  if (tarakSonuc.setSayisi > 0){
    html += `<div class="result-line head">${tr('resultHeadAutoSets')}</div>`;
    html += `<div class="result-line"><span>${tarakSonuc.setSayisi} × ${tarakSetName()}</span><span>${money(tarakSonuc.setSayisi * TARAK_SET.price)}</span></div>`;
  }

  if (hasIndividual){
    html += `<div class="result-line head">${tr('resultHeadProducts')}</div>`;
    if (rem.tavsan)     html += `<div class="result-line"><span>${rem.tavsan} × ${pname('tavsan')}</span><span>${money(rem.tavsan * PRICES.tavsan)}</span></div>`;
    if (rem.yaka)       html += `<div class="result-line"><span>${rem.yaka} × ${pname('yaka')}</span><span>${money(rem.yaka * PRICES.yaka)}</span></div>`;
    if (rem.ciftYaka)   html += `<div class="result-line"><span>${rem.ciftYaka} × ${pname('ciftYaka')}</span><span>${money(rem.ciftYaka * PRICES.ciftYaka)}</span></div>`;
    if (rem.teddy)      html += `<div class="result-line"><span>${rem.teddy} × ${pname('teddy')}</span><span>${money(rem.teddy * PRICES.teddy)}</span></div>`;
    if (rem.buyukSapka) html += `<div class="result-line"><span>${rem.buyukSapka} × ${pname('buyukSapka')}</span><span>${money(rem.buyukSapka * PRICES.buyukSapka)}</span></div>`;

    if (rem.kucukSapka){
      const full = Math.floor(rem.kucukSapka / HAT_BLOCK_SIZE);
      const partial = rem.kucukSapka % HAT_BLOCK_SIZE;
      html += `<div class="result-line"><span>${rem.kucukSapka} × ${pname('kucukSapka')}</span><span>${money(hatBlockCost(rem.kucukSapka))}</span></div>`;
      if (full)    html += `<div class="result-line sub"><span>${full} × 12</span><span>${money(full * HAT_BLOCK_TOTAL)}</span></div>`;
      if (partial) html += `<div class="result-line sub"><span>${partial}</span><span>${money(partialHatBlockCost(partial))}</span></div>`;
    }

    if (tarakSonuc.kalanKeci)  html += `<div class="result-line"><span>${tarakSonuc.kalanKeci} × ${pname('keciKiliTarak')}</span><span>${money(tarakSonuc.kalanKeci * PRICES.keciKiliTarak)}</span></div>`;
    if (tarakSonuc.kalanBambu) html += `<div class="result-line"><span>${tarakSonuc.kalanBambu} × ${pname('bambuTarak')}</span><span>${money(tarakSonuc.kalanBambu * PRICES.bambuTarak)}</span></div>`;
    if (state.kapiSusu)        html += `<div class="result-line"><span>${state.kapiSusu} × ${pname('kapiSusu')}</span><span>${money(kapiSusuCost)}</span></div>`;

    if (state.harfMagnet){
      const hb = harfMagnetBreakdown(state.harfMagnet);
      html += `<div class="result-line"><span>${state.harfMagnet} × ${pname('harfMagnet')}</span><span>${money(harfMagnetCost)}</span></div>`;
      if (hb.first) html += `<div class="result-line sub"><span>${hb.first}</span><span>${money(hb.firstCost)}</span></div>`;
      if (hb.extra) html += `<div class="result-line sub"><span>${hb.extra}</span><span>${money(hb.extraCost)}</span></div>`;
    }

    if (state.ciftIsim) html += `<div class="result-line"><span>${state.ciftIsim} × ${pname('ciftIsim')}</span><span>${money(ciftIsimCost)}</span></div>`;
  }

  if (extraServices.length){
    html += `<div class="result-line head">${tr('resultHeadExtra')}</div>`;
    extraServices.forEach(x => {
      html += `<div class="result-line"><span>${x.desc}</span><span>${money(Number(x.price))}</span></div>`;
    });
  }

  if (hasDiscount){
    html += `<div class="result-line head">${tr('resultHeadDiscount')}</div>`;
    html += `<div class="result-line"><span>${discountDesc}</span><span>-${money(appliedDiscount)}</span></div>`;
  }

  html += `<div class="dashed"></div>`;
  html += `<div class="result-line sub"><span>${tr('subtotalLabel')}</span><span>${money(araToplam)}</span></div>`;

  // Yuvarlama farkı: iki dönüştürülmüş değerin farkı olarak gösterilir (küçük TL farkının
  // dönüşüm formülüyle orantısız büyümesini önlemek için).
  const araDisp = locale === 'intl' ? convertToIntl(araToplam) : araToplam;
  const finalDisp = locale === 'intl' ? convertToIntl(finalToplam) : finalToplam;
  const diff = finalDisp - araDisp;
  if (diff !== 0) html += `<div class="result-line sub"><span>${tr('roundingLabel')}</span><span>${diff > 0 ? '+' : ''}${fmt(diff)} ${tr('currency')}</span></div>`;
  html += `<div class="grand"><span>${tr('totalLine')}</span><span>${money(finalToplam)}</span></div>`;

  box.innerHTML = html;
}

/* =========================================================
   10. MÜŞTERİ MESAJI OLUŞTURMA
   ========================================================= */

// Sete ait içerik satırlarını, tarak birleşimini, Uyku Arkadaşı+Boyunluk birleşimini,
// ek hizmetleri ve indirimi içeren ürün satırlarını üretir. TR ve EN mesajları bu ortak
// listeyi kullanır — yalnızca isimler/para birimi locale'e göre değişir, sıra ve mantık aynıdır.
function buildProductLines(result){
  const { anaSetSonuc, tarakSonuc, ciftIsimCost, extraServices, hasDiscount, discountDesc, appliedDiscount } = result;
  const lines = [];
  const cNames = contentNames();
  const tNames = tarakContentNames();
  const pouchWord = locale === 'intl' ? 'Pouch' : 'Kese';

  // Bir setin/otomatik setin içeriğini "   • 2 Ürün Adı" biçiminde, aralarında boş satırlarla ekler.
  function pushContentLines(order, displayNames, requires, count){
    lines.push('');
    order.forEach(key => {
      const qty = (requires[key] || 0) * count;
      if (qty > 0) lines.push(`   • ${qty} ${displayNames[key]}`);
    });
    lines.push('');
  }

  // Güncelleme 20: setler her zaman en yüksek fiyatlıdan en düşüğe doğru gösterilir.
  // Bu yalnızca gösterim sırasıdır; hangi kombinasyonun seçildiğini optimizeAnaSetler belirler.
  MESSAGE_SET_DISPLAY_ORDER.forEach(id => {
    const i = SETS.findIndex(s => s.id === id);
    const c = anaSetSonuc.counts[i];
    if (c > 0){
      lines.push(`• ${c} × ${sname(i)} — ${money(c * SETS[i].price)}`);
      pushContentLines(SETS[i].contentOrder, cNames, SETS[i].requires, c);
    }
  });

  // Tarak Seti: Kese/Pouch ürünle birlikte ücretsiz gelir, ürün adının parçası olarak tek satırda gösterilir.
  if (tarakSonuc.setSayisi > 0){
    lines.push(`• ${tarakSonuc.setSayisi} × ${tarakSetName()} + ${pouchWord} — ${money(tarakSonuc.setSayisi * TARAK_SET.price)}`);
    pushContentLines(TARAK_SET_CONTENT_ORDER, tNames, TARAK_SET.requires, tarakSonuc.setSayisi);
  }

  // Uyku Arkadaşı + Boyunluk birleştirme (Güncelleme 15-16): yalnızca mesaj görünümü içindir,
  // set fiyatlarını veya hesaplama motorunu etkilemez. Eşleşen adet kadar tek satırda,
  // kalan (eşleşmeyen) adet ayrı satırda gösterilir.
  function mergeAndPush(countA, nameA, priceA, countB, nameB, priceB){
    const merged = Math.min(countA, countB);
    const extraA = countA - merged;
    const extraB = countB - merged;
    if (merged > 0) lines.push(`• ${merged} × ${nameA} + ${nameB} — ${money(merged * (priceA + priceB))}`);
    if (extraA > 0) lines.push(`• ${extraA} × ${nameA} — ${money(extraA * priceA)}`);
    if (extraB > 0) lines.push(`• ${extraB} × ${nameB} — ${money(extraB * priceB)}`);
  }

  const rem = anaSetSonuc.remaining;
  mergeAndPush(rem.tavsan || 0, pname('tavsan'), PRICES.tavsan, rem.yaka || 0, pname('yaka'), PRICES.yaka);
  mergeAndPush(rem.teddy || 0, pname('teddy'), PRICES.teddy, rem.ciftYaka || 0, pname('ciftYaka'), PRICES.ciftYaka);

  if (rem.buyukSapka) lines.push(`• ${rem.buyukSapka} × ${pname('buyukSapka')} — ${money(rem.buyukSapka * PRICES.buyukSapka)}`);
  if (rem.kucukSapka) lines.push(`• ${rem.kucukSapka} × ${pname('kucukSapka')} — ${money(hatBlockCost(rem.kucukSapka))}`);
  if (tarakSonuc.kalanKeci)  lines.push(`• ${tarakSonuc.kalanKeci} × ${pname('keciKiliTarak')} + ${pouchWord} — ${money(tarakSonuc.kalanKeci * PRICES.keciKiliTarak)}`);
  if (tarakSonuc.kalanBambu) lines.push(`• ${tarakSonuc.kalanBambu} × ${pname('bambuTarak')} + ${pouchWord} — ${money(tarakSonuc.kalanBambu * PRICES.bambuTarak)}`);
  if (state.kapiSusu)   lines.push(`• ${state.kapiSusu} × ${pname('kapiSusu')} — ${money(state.kapiSusu * PRICES.kapiSusu)}`);
  if (state.harfMagnet) lines.push(`• ${state.harfMagnet} × ${pname('harfMagnet')} — ${money(harfMagnetCost(state.harfMagnet))}`);
  if (state.ciftIsim)   lines.push(`• ${state.ciftIsim} × ${pname('ciftIsim')} — ${money(ciftIsimCost)}`);

  // Ek Hizmet / Ek Ücret (Güncelleme 23): ürünler arasında, kullanıcının girdiği açıklama ile.
  extraServices.forEach(x => {
    lines.push(`• ${x.desc} — ${money(Number(x.price))}`);
  });

  // İndirim (Güncelleme 22): "İndirim (Açıklama) — -XXX TL" biçiminde, negatif işaretle.
  if (hasDiscount){
    lines.push(`• ${tr('resultHeadDiscount')} (${discountDesc}) — -${money(appliedDiscount)}`);
  }

  return lines;
}

function buildMessage(result){
  const { kargoDahilToplam, finalToplam } = result;

  if (locale === 'tr'){

    lines.push('');
    lines.push(`⏳ Hazırlık Süresi: ${SABIT_MESAJ.hazirlik}`);

    // Şartlı bilgi satırı: sepette en az 1 Çift İsim ürünü varsa gösterilir.

    }

    lines.push('');

  } else {

    // "Kargo Dahil Toplam Tutar" yerine yalnızca "Products Total" (kargosuz) kullanılır.
    lines.push('Hello! 🩷');

    lines.push(...productLines);
    lines.push('');
    lines.push('━━━━━━━━━━━━━━');
    lines.push('');
    lines.push('📦 Shipping: Calculated separately');
    lines.push('');
    lines.push(`💰 Products Total: ${money(finalToplam)}`);
    lines.push('');
    lines.push('⏳ Production Time: Up to 15 business days (usually faster)');
    lines.push('');
    lines.push('📦 Shipping cost depends on destination country, shipping option and package size.');
    lines.push('Standard box size:');
    lines.push('40 × 30 × 15 cm');
    lines.push('');
    lines.push('Thank you. 🤍');
  }

  // Art arda gelen boş satırları (örn. bir set içeriğinin hemen ardından ayraç geldiğinde) tek satıra indirger.
  const collapsed = lines.filter((l, i) => !(l === '' && lines[i - 1] === ''));

  return collapsed.join('\n');
}

let toastTimer = null;
function showToast(text){
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

/* =========================================================
   12. ANA YENİDEN HESAPLAMA DÖNGÜSÜ
   ========================================================= */

function recalc(){
  const result = optimizeAll(state);
  document.getElementById('totalAmount').innerHTML = money(result.finalToplam).replace(
    new RegExp(`${tr('currency')}$`), `<span>${tr('currency')}</span>`
  );
  renderResult(result);
  document.getElementById('msgBox').textContent = buildMessage(result);
}

/* =========================================================
   13. OLAY DİNLEYİCİLERİ (Kopyala / Temizle / Yazdır)
   ========================================================= */

document.getElementById('btnCopy').addEventListener('click', () => {
  const text = document.getElementById('msgBox').textContent;
  const fallbackCopy = () => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { document.execCommand('copy'); showToast(tr('toastCopied')); }
    catch (e) { showToast(tr('toastCopyFail')); }
    document.body.removeChild(ta);
  };

  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => showToast(tr('toastCopied'))).catch(fallbackCopy);
  } else {
    fallbackCopy();
  }
});

document.getElementById('btnPrint').addEventListener('click', () => window.print());

  aylikSet:      { tavsan: 1, yaka: 1, buyukSapka: 1, kucukSapka: 12 },

function addQuickSet(items){
  Object.keys(items).forEach(key => {
    state[key] = (state[key] || 0) + items[key];
  });
  renderProducts();
  recalc();
}

document.getElementById('btnClear').addEventListener('click', () => {

/* =========================================================
   15. EK HİZMET / EK ÜCRET ALANI (Güncelleme 23)
   ========================================================= */

function escAttr(str){
  return String(str == null ? '' : str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

function renderExtraServices(){
  const list = document.getElementById('extraServiceList');
  list.innerHTML = '';
  state.extraServices.forEach((item, idx) => {
    const row = document.createElement('div');
    row.className = 'extra-row';
    row.innerHTML = `
      <input type="text" class="field-input" data-idx="${idx}" data-field="desc" placeholder="${tr('extraDescPlaceholder')}" value="${escAttr(item.desc)}">
      <input type="number" class="field-input amount" data-idx="${idx}" data-field="price" placeholder="${tr('extraPricePlaceholder')}" min="0" value="${escAttr(item.price)}">
      <button class="extra-remove" data-idx="${idx}" aria-label="sil">×</button>
    `;
    list.appendChild(row);
  });
  list.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('input', () => {
      const idx = parseInt(inp.dataset.idx, 10);
      state.extraServices[idx][inp.dataset.field] = inp.value;
      recalc();
    });
  });
  list.querySelectorAll('.extra-remove').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.idx, 10);
      state.extraServices.splice(idx, 1);
      renderExtraServices();
      recalc();
    });
  });
}

document.getElementById('btnAddExtra').addEventListener('click', () => {
  state.extraServices.push({ desc: '', price: '' });
  renderExtraServices();
});
