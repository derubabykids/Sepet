<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>DERU — Fiyat Optimizasyon Motoru</title>
<style>
  :root{
    --ink:#231916;
    --paper:#ffffff;
    --rose:#c96b7d;
    --rose-deep:#8a3f52;
    --blush:#faf1ef;
    --line:#ece3e0;
    --muted:#9a8a85;
    --shadow:0 4px 18px rgba(35,25,22,0.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:50px;
  }
  .wrap{max-width:520px;margin:0 auto;padding:26px 18px 60px;}

  header{text-align:center;margin-bottom:20px;}
  header h1{
    font-size:40px;
    font-weight:800;
    letter-spacing:0.02em;
    margin:0;
    color:var(--ink);
  }
  header .sub{
    font-size:12.5px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--muted);
    margin-top:4px;
  }

  .card{
    background:var(--paper);
    border-radius:20px;
    box-shadow:var(--shadow);
    padding:20px;
    margin-bottom:18px;
  }

  .total-card{
    background:var(--rose);
    border-radius:20px;
    padding:22px 22px;
    color:#fff;
    margin-bottom:20px;
    box-shadow:var(--shadow);
  }
  .total-card .label{
    font-size:12px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    opacity:0.85;
  }
  .total-card .amount{
    font-size:38px;
    font-weight:800;
    margin-top:4px;
    line-height:1;
  }
  .total-card .amount span{font-size:18px;font-weight:500;opacity:0.85;}

  h2.section-title{
    font-size:12px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 12px;
    font-weight:700;
  }

  .product-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:11px 0;
    border-bottom:1px solid var(--line);
    gap:10px;
  }
  .product-row:last-child{border-bottom:none;}
  .product-row .info{flex:1;min-width:0;}
  .product-row .name{font-size:14.5px;font-weight:600;}
  .product-row .price{font-size:12px;color:var(--muted);margin-top:1px;}

  .stepper{
    display:flex;
    align-items:center;
    background:var(--blush);
    border-radius:12px;
    overflow:hidden;
    flex-shrink:0;
  }
  .stepper button{
    width:36px;height:36px;
    border:none;
    background:transparent;
    font-size:18px;
    color:var(--rose-deep);
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .stepper button:active{background:rgba(201,107,125,0.18);}
  .stepper .qty{
    width:32px;
    text-align:center;
    font-size:14.5px;
    font-weight:700;
  }

  .result-line{
    display:flex;justify-content:space-between;
    padding:6px 0;
    font-size:13.5px;
  }
  .result-line.sub{color:var(--muted);font-size:12px;padding-left:12px;}
  .result-line.head{
    font-size:11.5px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--rose-deep);
    font-weight:700;
    margin-top:12px;
    padding-bottom:4px;
  }
  .result-line.head:first-child{margin-top:0;}
  .dashed{border-top:1px dashed var(--line);margin:10px 0;}
  .grand{
    display:flex;justify-content:space-between;
    font-size:17px;font-weight:800;
    color:var(--rose-deep);
    padding-top:4px;
  }
  .empty-msg{color:var(--muted);text-align:center;font-size:13.5px;padding:8px 0;}

  .msg-box{
    white-space:pre-wrap;
    background:var(--blush);
    border-radius:14px;
    padding:16px;
    font-size:13.5px;
    line-height:1.7;
    color:var(--ink);
  }

  .btn-row{
    display:flex;
    gap:10px;
    margin-top:14px;
  }
  .btn{
    flex:1;
    border:none;
    border-radius:12px;
    padding:12px 10px;
    font-size:13.5px;
    font-weight:700;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .btn-primary{background:var(--rose);color:#fff;}
  .btn-secondary{background:var(--blush);color:var(--rose-deep);}
  .btn:active{opacity:0.85;}

  .quick-card-title{
    font-size:15px;
    font-weight:700;
    margin-bottom:12px;
  }
  .quick-btn-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .quick-btn{
    flex:1;
    min-width:130px;
    border:none;
    border-radius:14px;
    padding:16px 10px;
    font-size:14px;
    font-weight:700;
    background:var(--blush);
    color:var(--rose-deep);
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .quick-btn:active{background:rgba(201,107,125,0.2);}

  /* ---- Yurtdışı toggle ---- */
  .locale-card{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .locale-card .locale-label{
    font-size:15px;
    font-weight:700;
  }
  .vat-note{
    margin-top:10px;
    font-size:12px;
    line-height:1.5;
    color:var(--muted);
  }
  .vat-note.loading{color:var(--muted);}
  .vat-note.error{color:#b3492f;}
  .vat-note a{
    color:var(--rose-deep);
    font-weight:700;
    text-decoration:underline;
    cursor:pointer;
  }
  .switch{
    position:relative;width:50px;height:29px;
    background:var(--line);border-radius:20px;
    cursor:pointer;flex-shrink:0;
    transition:background .15s;
  }
  .switch.on{background:var(--rose);}
  .switch .knob{
    position:absolute;top:3px;left:3px;
    width:23px;height:23px;border-radius:50%;
    background:#fff;
    transition:left .15s;
    box-shadow:0 1px 2px rgba(0,0,0,0.2);
  }
  .switch.on .knob{left:24px;}

  /* ---- İndirim / Ek Hizmet form alanları ---- */
  .field-row{
    display:flex;
    gap:8px;
    margin-bottom:8px;
  }
  .field-row:last-child{margin-bottom:0;}
  .field-input{
    flex:1;
    border:1px solid var(--line);
    background:var(--blush);
    border-radius:10px;
    padding:10px 12px;
    font-size:13.5px;
    color:var(--ink);
    font-family:inherit;
    min-width:0;
  }
  .field-input.amount{flex:0 0 110px;}
  .field-input:focus{outline:2px solid var(--rose);outline-offset:-1px;}

  .extra-row{
    display:flex;
    gap:8px;
    align-items:center;
    margin-bottom:8px;
  }
  .extra-row .field-input{margin-bottom:0;}
  .extra-remove{
    flex-shrink:0;
    width:36px;height:36px;
    border:none;
    border-radius:10px;
    background:var(--blush);
    color:var(--rose-deep);
    font-size:16px;
    font-weight:700;
    cursor:pointer;
  }
  .extra-add-btn{
    width:100%;
    border:1px dashed var(--rose);
    background:transparent;
    color:var(--rose-deep);
    border-radius:10px;
    padding:10px;
    font-size:13.5px;
    font-weight:700;
    cursor:pointer;
    margin-top:2px;
  }

  .toast{
    position:fixed;
    left:50%;bottom:24px;
    transform:translateX(-50%) translateY(20px);
    background:var(--ink);
    color:#fff;
    padding:10px 18px;
    border-radius:30px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s, transform .2s;
    z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media print{
    .no-print{display:none !important;}
    body{padding:0;}
    .total-card{background:#fff !important;color:var(--ink) !important;box-shadow:none;border:1px solid var(--line);}
    .card{box-shadow:none;border:1px solid var(--line);}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>DERU</h1>
    <div class="sub" id="txtSubtitle">Fiyat Optimizasyon Motoru</div>
  </header>

  <div class="card locale-card no-print">

  </div>

  <div class="total-card">
    <div class="label" id="txtTotalLabel">Toplam Tutar</div>
    <div class="amount" id="totalAmount">0 <span>TL</span></div>
  </div>

  <div class="card no-print">
    <div class="quick-card-title" id="txtQuickCard1">🐰 Tavşan Setleri</div>
    <div class="quick-btn-row">
      <button class="quick-btn" id="qsYasSeti">➕ Yaş / 6 Aylık Set</button>
      <button class="quick-btn" id="qsAylikSet">➕ 12 Aylık Set</button>
    </div>
  </div>

  <div class="card no-print">
    <div class="quick-card-title" id="txtQuickCard2">🧸 Teddy Setleri</div>
    <div class="quick-btn-row">
      <button class="quick-btn" id="qsTeddyYasSeti">➕ Teddy Yaş / 6 Aylık Set</button>
      <button class="quick-btn" id="qsTeddyAylikSet">➕ Teddy 12 Aylık Set</button>
    </div>
  </div>

  <div class="card no-print">
    <div class="quick-card-title" id="txtQuickCard3">🪮 Tarak Setleri</div>
    <div class="quick-btn-row">
      <button class="quick-btn" id="qsTarakSeti">➕ Tarak Seti</button>
      <button class="quick-btn" id="qsTarak2Kese">🩷 2 Keseli Tarak Seti</button>
    </div>
  </div>

  <div class="card no-print">
    <h2 class="section-title" id="txtUrunlerTitle">Ürünler</h2>
    <div id="productList"></div>
  </div>

  <div class="card no-print">
    <h2 class="section-title" id="txtIndirimTitle">🏷️ İndirim</h2>
    <div class="field-row">
      <input type="text" class="field-input" id="discountDesc" placeholder="Açıklama (örn. Kampanya)">
      <input type="number" class="field-input amount" id="discountAmount" placeholder="TL" min="0">
    </div>
  </div>

  <div class="card no-print">
    <h2 class="section-title" id="txtEkHizmetTitle">➕ Ek Hizmet / Ek Ücret</h2>
    <div id="extraServiceList"></div>
    <button class="extra-add-btn" id="btnAddExtra">+ Ekle</button>
  </div>

  <div class="card no-print" id="shippingCard" style="display:none;">
    <h2 class="section-title" id="txtShippingTitle">📦 Shipping</h2>
    <div class="field-row">
      <input type="number" class="field-input" id="intlShippingCost" placeholder="Biliyorsanız kargo tutarını yazın (boş = Calculated Separately)" min="0">
    </div>
  </div>

  <div class="card">
    <h2 class="section-title" id="txtFiyatDokumuTitle">Fiyat Dökümü</h2>
    <div id="resultBox"></div>
  </div>

  <div class="card">
    <h2 class="section-title" id="txtMusteriMesajiTitle">Müşteri Mesajı</h2>
    <div class="msg-box" id="msgBox"></div>
    <div class="btn-row no-print">
      <button class="btn btn-primary" id="btnCopy">Kopyala</button>
      <button class="btn btn-secondary" id="btnPrint">Yazdır</button>
    </div>
  </div>

  <div class="btn-row no-print">
    <button class="btn btn-secondary" id="btnClear">Siparişi Temizle</button>
  </div>

</div>

<div class="toast" id="toast">Kopyalandı</div>

<script>
/* =========================================================
   1. VERİ YAPILARI (DATA)
   ========================================================= */

// Sabit fiyatlı, doğrudan çarpılan ürünler
const PRICES = {

  yaka: 200,
  ciftYaka: 300,
  buyukSapka: 350,

  harfMagnet: null, // özel kademeli fiyat sistemi (aşağıda)

// Ekranda gösterilecek ürün listesi (kolayca yeni ürün eklenebilir)

  { id: 'tavsan',        name: 'Tavşan Uyku Arkadaşı', nameEN: 'Bunny Sleep Buddy',                 price: PRICES.tavsan },

// Müşteri mesajında setlerin gösterim önceliği (Güncelleme 20). Yalnızca görüntü sırasını belirler;

/* =========================================================
   1c. YURTDIŞI FİYAT ÇEVRİMİ (Güncelleme 25)
   ========================================================= */

// Türkiye fiyatını yurtdışı fiyatına çevirir: (fiyat / 0.70), en yakın üst 20 TL katına yuvarlanır.
// Yalnızca GÖRÜNTÜLEME amaçlıdır — iç hesaplama TL üzerinden değişmeden devam eder.
function convertToIntl(tl){
  return Math.ceil((tl / 0.70) / 20) * 20;
}

// Bir TL tutarını, aktif locale'e göre GÖRÜNTÜLENECEK sayısal değere çevirir.
// TR: değeri aynen döndürür. INTL: (tl/0.70) hesaplayıp en yakın üst 20'ye yuvarlar.
// KRİTİK (Güncelleme 28): her satır bu fonksiyonla TEK SEFERDE, bağımsız olarak yuvarlanır.
// Toplamlar bu yuvarlanmış değerlerin TOPLAMI olmalı — asla önce TL toplanıp sonra bir kez
// çevrilmemelidir (bu, eski hatalı davranıştı).
function displayAmount(tl){
  return locale === 'intl' ? convertToIntl(tl) : tl;
}

// Her yerde fiyat göstermek için tek nokta: locale'e göre TL veya TRY döndürür.
function money(tl){
  return `${fmt(displayAmount(tl))} ${tr('currency')}`;
}

// İndirim ve Ek Hizmet tutarları için: yurtdışı modunda dahi 0.70'e bölme / 20'ye yuvarlama

/* =========================================================
   3. KÜÇÜK ŞAPKA BLOK HESAPLAMA SİSTEMİ
   ========================================================= */

// Bir bloğun içindeki ilk k adet şapkanın toplam fiyatı (k: 0-12 arası)
function partialHatBlockCost(k){
  if (k <= 0) return 0;
  let total = 0;
  for (let i = 0; i < k; i++) total += HAT_UNIT_PRICES[i];
  return total;
}

// n adet küçük şapkanın toplam fiyatı — bloklar birbirinden bağımsızdır.
// 13. şapka yeni blok başlatır, 25. şapka yeni blok başlatır, vs.
function hatBlockCost(n){
  if (n <= 0) return 0;
  const fullBlocks = Math.floor(n / HAT_BLOCK_SIZE);
  const remainder = n % HAT_BLOCK_SIZE;
  return (fullBlocks * HAT_BLOCK_TOTAL) + partialHatBlockCost(remainder);
}

// İlk 5 harfin HER BİRİ 100 TL, 6. harften itibaren HER BİRİ 70 TL.
// Bu TL tabanlı formül hem Türkiye hem Yurtdışı fiyatlarının temelidir (Yurtdışı çevrimi bunun üzerine uygulanır).
function harfMagnetCost(n){
  if (n <= 0) return 0;
  if (n <= 5) return n * 100;
  return (5 * 100) + ((n - 5) * 70);
}

// Ekranda gösterim için: kaç harf ilk kademede (100 TL), kaç harf ikinci kademede (70 TL)
function harfMagnetBreakdown(n){
  const first = Math.min(n, 5);
  const extra = Math.max(n - 5, 0);
  return { first, extra, firstCost: first * 100, extraCost: extra * 70 };
}

// Büyük Bubble Harf: Harf Magnet'ten TAMAMEN BAĞIMSIZ, kendi kademeli fiyat sistemi (Güncelleme 41).
// İlk 5 adet 300 TL/adet, 6. adetten itibaren 210 TL/adet. Set optimizasyonuna dahil değildir,
// Harf Magnet ile birleştirilmez — tek başına, sabit bir fiyatlandırma kuralı olarak çalışır.
function bubbleHarfCost(n){
  if (n <= 0) return 0;
  if (n <= 5) return n * 300;
  return (5 * 300) + ((n - 5) * 210);
}

// Ekranda gösterim için: kaç adet ilk kademede (300 TL), kaç adet ikinci kademede (210 TL)
function bubbleHarfBreakdown(n){
  const first = Math.min(n, 5);
  const extra = Math.max(n - 5, 0);
  return { first, extra, firstCost: first * 300, extraCost: extra * 210 };
}

/* =========================================================
   4. TARAK OTOMATİK SET OLUŞTURMA
   ========================================================= */

// Mümkün olan en fazla sayıda "2'li Tarak Seti" oluşturur (her set 1 keçi kılı + 1 bambu tarak).
// Bir set her zaman iki ürünü ayrı ayrı almaktan daha ucuzdur (1400 < 720+840), bu yüzden
// maksimum eşleştirme her zaman minimum fiyatı verir.
//
// forcedSeparate (Güncelleme 40): "🩷 2 Keseli Tarak Seti" hızlı ekleme butonuyla eklenen
// adet sayısıdır. Bu kadar keçi kılı + bambu tarak çifti KASITLI OLARAK eşleştirmenin dışında
// tutulur (rezerve edilir) ve her zaman kendi normal fiyatlarıyla (720 + 840) ayrı satırlar
// olarak hesaplanır — 1400 TL'lik indirimli set fiyatı bu adetlere asla uygulanmaz. Kullanıcının
// +/- ile elle eklediği ek adetler ise her zaman olduğu gibi normal şekilde eşleştirilmeye devam eder.
function optimizeTarakSeti(keciKiliAdet, bambuAdet, forcedSeparate){
  const reserved = Math.min(Math.max(forcedSeparate || 0, 0), keciKiliAdet, bambuAdet);
  const pairableKeci = keciKiliAdet - reserved;
  const pairableBambu = bambuAdet - reserved;

  const setSayisi = Math.min(pairableKeci, pairableBambu);
  const kalanKeci = (pairableKeci - setSayisi) + reserved;
  const kalanBambu = (pairableBambu - setSayisi) + reserved;
  const cost = (setSayisi * TARAK_SET.price)
             + (kalanKeci * PRICES.keciKiliTarak)
             + (kalanBambu * PRICES.bambuTarak);
  return { setSayisi, kalanKeci, kalanBambu, cost };
}

/* =========================================================
   5. ANA SET OPTİMİZASYON MOTORU (Recursive Backtracking)
   ========================================================= */

// Sette yer almayan kalan ürünlerin (tavşan, yaka, çift yaka, teddy, büyük şapka, küçük şapka)
// fiyatını hesaplar. Küçük şapka için blok sistemi burada devreye girer.
function leftoverCost(inv){
  return (inv.tavsan    || 0) * PRICES.tavsan
       + (inv.yaka      || 0) * PRICES.yaka
       + (inv.ciftYaka  || 0) * PRICES.ciftYaka
       + (inv.teddy     || 0) * PRICES.teddy
       + (inv.buyukSapka|| 0) * PRICES.buyukSapka
       + hatBlockCost(inv.kucukSapka || 0);
}

// Tüm set kombinasyonlarını (SETS dizisindeki her set için 0..maksimum adet) tam arama ile dener.
// Greedy DEĞİLDİR: "en çok set" değil, "en düşük toplam fiyat" veren kombinasyon seçilir.
// Eşit fiyatlı durumlarda, setleri kullanan kombinasyon tercih edilir (döküm ekranında anlamlı olması için).
function optimizeAnaSetler(inventory){
  let best = null;
  const n = SETS.length;
  const SAFETY_CAP = 40; // gerçekçi sipariş adetleri için güvenlik sınırı

  function maxPossible(setIdx, inv){
    const req = SETS[setIdx].requires;
    let max = Infinity;
    for (const key in req) {
      max = Math.min(max, Math.floor((inv[key] || 0) / req[key]));
    }
    if (max === Infinity) max = 0;
    return Math.min(max, SAFETY_CAP);
  }

  function backtrack(idx, inv, costSoFar, counts){
    if (idx === n){
      const total = costSoFar + leftoverCost(inv);
      if (best === null || total <= best.cost){
        best = { counts: counts.slice(), cost: total, remaining: Object.assign({}, inv) };
      }
      return;
    }
    const cap = maxPossible(idx, inv);
    for (let c = 0; c <= cap; c++){
      const newInv = Object.assign({}, inv);
      const req = SETS[idx].requires;
      for (const key in req) newInv[key] -= req[key] * c;
      counts.push(c);
      backtrack(idx + 1, newInv, costSoFar + (c * SETS[idx].price), counts);
      counts.pop();
    }
  }

  backtrack(0, Object.assign({}, inventory), 0, []);
  return best;
}

/* =========================================================
   6. TOPLU OPTİMİZASYON — TÜM MOTORU BİRLEŞTİRİR
   ========================================================= */

function optimizeAll(s){
  const anaSetSonuc = optimizeAnaSetler(s);
  const tarakSonuc = optimizeTarakSeti(s.keciKiliTarak || 0, s.bambuTarak || 0, s.tarakForcedSeparate || 0);
  const kapiSusuCost = (s.kapiSusu || 0) * PRICES.kapiSusu;
  const harfMagnetTotal = harfMagnetCost(s.harfMagnet || 0);
  const bubbleHarfTotal = bubbleHarfCost(s.bubbleHarf || 0);
  const ciftIsimCost = (s.ciftIsim || 0) * PRICES.ciftIsim;

  // Ek Hizmet / Ek Ücret (Güncelleme 23): kullanıcının serbestçe eklediği kalemlerin toplamı.
  const extraServices = (s.extraServices || []).filter(x => x.desc && Number(x.price) > 0);
  const extraServicesTotal = extraServices.reduce((sum, x) => sum + Number(x.price), 0);

  const rawTotal = anaSetSonuc.cost + tarakSonuc.cost + kapiSusuCost + harfMagnetTotal + bubbleHarfTotal + ciftIsimCost + extraServicesTotal;

  // İndirim (Güncelleme 22): toplamdan düşülür, negatif toplam oluşmasına izin verilmez.
  const requestedDiscount = Math.max(0, Number(s.discountAmount) || 0);
  const appliedDiscount = Math.min(requestedDiscount, rawTotal);
  const discountDesc = (s.discountDesc || '').trim();
  const hasDiscount = appliedDiscount > 0 && discountDesc.length > 0;

  const araToplam = rawTotal - (hasDiscount ? appliedDiscount : 0);
  const finalToplam = Math.round(araToplam / 10) * 10; // yuvarlama sadece en sonda
  const kargoDahilToplam = finalToplam + SABIT_MESAJ.kargo; // sadece TR müşteri mesajında kullanılır

  return {
    anaSetSonuc,
    tarakSonuc,
    kapiSusuCost,
    harfMagnetCost: harfMagnetTotal,
    bubbleHarfCost: bubbleHarfTotal,
    ciftIsimCost,
    extraServices,
    extraServicesTotal,
    hasDiscount,
    discountDesc,
    appliedDiscount: hasDiscount ? appliedDiscount : 0,
    rawTotal,
    araToplam,
    finalToplam,
    kargoDahilToplam
  };
}

/* =========================================================
   6b. YURTDIŞI TOPLAMI — SATIR BAZLI DOĞRU HESAPLAMA (Güncelleme 28)
   ========================================================= */

// KRİTİK: Yurtdışı modunda toplam, HER satırın kendi başına (TL/0.70, en yakın üst 20'ye
// yuvarlanarak) dönüştürülmüş halinin TOPLAMI olmalıdır — asla önce TL toplanıp sonra
// tek seferde çevrilmemelidir. Bu fonksiyon, ekranda/mesajda gösterilen HER satırla birebir
// aynı TL tutarlarını kullanır (ekranda görünen fiyatların toplamı ile matematiksel olarak
// birebir eşleşmesi garanti edilsin diye) ve her birini AYRI AYRI displayAmount() ile çevirip
// toplar. Bu sayede Price Breakdown, Customer Message ve Copy Message hep aynı sonucu verir.
function computeIntlSubtotal(result){
  const { anaSetSonuc, tarakSonuc, ciftIsimCost, extraServices, hasDiscount, appliedDiscount } = result;
  const rem = anaSetSonuc.remaining;
  let sum = 0;

  // Ana setler (her biri kendi TL tutarıyla ayrı ayrı çevrilir)
  SETS.forEach((set, i) => {
    const c = anaSetSonuc.counts[i];
    if (c > 0) sum += displayAmount(c * set.price);
  });

  // Otomatik oluşturulan Tarak Seti
  if (tarakSonuc.setSayisi > 0) sum += displayAmount(tarakSonuc.setSayisi * TARAK_SET.price);

  // Uyku Arkadaşı + Boyunluk birleştirme: ekranda TEK satır olarak göründüğü için
  // birleşik TL tutarı TEK SEFERDE çevrilir (gösterilen fiyatla birebir eşleşmesi için).
  function mergedAmount(countA, priceA, countB, priceB){
    const merged = Math.min(countA, countB);
    const extraA = countA - merged;
    const extraB = countB - merged;
    let s = 0;
    if (merged > 0) s += displayAmount(merged * (priceA + priceB));
    if (extraA > 0) s += displayAmount(extraA * priceA);
    if (extraB > 0) s += displayAmount(extraB * priceB);
    return s;
  }
  sum += mergedAmount(rem.tavsan || 0, PRICES.tavsan, rem.yaka || 0, PRICES.yaka);
  sum += mergedAmount(rem.teddy || 0, PRICES.teddy, rem.ciftYaka || 0, PRICES.ciftYaka);

  if (rem.buyukSapka) sum += displayAmount(rem.buyukSapka * PRICES.buyukSapka);
  if (rem.kucukSapka) sum += displayAmount(hatBlockCost(rem.kucukSapka));
  if (tarakSonuc.kalanKeci)  sum += displayAmount(tarakSonuc.kalanKeci * PRICES.keciKiliTarak);
  if (tarakSonuc.kalanBambu) sum += displayAmount(tarakSonuc.kalanBambu * PRICES.bambuTarak);
  if (state.kapiSusu)   sum += displayAmount(state.kapiSusu * PRICES.kapiSusu);
  if (state.harfMagnet) sum += displayAmount(harfMagnetCost(state.harfMagnet));
  if (state.bubbleHarf) sum += displayAmount(bubbleHarfCost(state.bubbleHarf));
  if (state.ciftIsim)   sum += displayAmount(ciftIsimCost);

  // Ek Hizmet / Ek Ücret: kullanıcının yazdığı rakam yurtdışında da dönüştürülmez, aynen kullanılır.
  extraServices.forEach(x => { sum += Number(x.price); });

  // İndirim: kullanıcının yazdığı rakam yurtdışında da dönüştürülmez, aynen düşülür.
  if (hasDiscount) sum -= appliedDiscount;

  // Kargo/Shipping (opsiyonel, yalnızca girildiyse): kullanıcının isteği üzerine
  // VAT tabanına DAHİL EDİLMEZ — yalnızca en son, VAT hesaplandıktan sonra TOPLAM'a eklenir
  // (bkz. recalc/renderResult/buildMessage). Bu yüzden burada sum'a eklenmez.
  return sum;
}

// VAT formülü (Güncelleme 47, 49, 55):
// VAT = ((Ürün Toplamı + Kargo) × %15) + (4.50 USD'nin GÜNCEL TL karşılığı)
// - Ürün Toplamı: computeIntlSubtotal() (kargo hariç, zaten satır bazlı doğru yuvarlanmış toplam)
// - Kargo: kullanıcının girdiği ham tutar (dönüştürülmez)
// - 4.50 USD kısmı yalnızca canlı kur başarıyla alındıysa hesaplanır; alınamadıysa VAT
//   hesaplanamaz (ok:false) ve arayüzde uyarı gösterilir — asla sabit/eski bir kur kullanılmaz.
// - Güncelleme 56: %15 + 4.50 USD toplandıktan SONRA, nihai VAT tutarı küsuratlıysa yukarı
//   doğru bir sonraki TAM TL'ye yuvarlanır (matematiksel yuvarlama değil, her zaman yukarı).
//   Bu yuvarlama yalnızca VAT'ın kendisine uygulanır; Ürün Toplamı/Kargo hesabı etkilenmez.
const USD_FEE = 4.50;

function computeVat(intlSubtotal, shippingVal){
  if (rateStatus !== 'ok' || !usdTryRate) return { amount: 0, ok: false };
  const vatBase = intlSubtotal + (shippingVal || 0);
  const percentPart = vatBase * 0.15;
  const usdFeeTRY = USD_FEE * usdTryRate;
  const rawVat = percentPart + usdFeeTRY;
  const roundedVat = Math.ceil(rawVat); // her zaman yukarı, bir sonraki tam TL'ye
  return { amount: roundedVat, ok: true };
}

/* =========================================================
   6c. USD/TRY GÜNCEL KUR (Güncelleme 48)
   ========================================================= */

// Sabit/manuel kur KULLANILMAZ. Kur yalnızca Yurtdışı Modu + VAT açıkken, ihtiyaç anında
// internetten çekilir ve oturum boyunca önbelleğe alınır. Alınamazsa kullanıcıya net bir
// uyarı gösterilir; eski/tahmini bir değere asla düşülmez.
let usdTryRate = null;
let rateStatus = 'idle'; // 'idle' | 'loading' | 'ok' | 'error'

async function fetchUsdTryRate(){
  if (rateStatus === 'loading') return;
  rateStatus = 'loading';
  recalc();

  const sources = [
    { url: 'https://open.er-api.com/v6/latest/USD', parse: d => d && d.rates && d.rates.TRY },
    { url: 'https://api.frankfurter.app/latest?from=USD&to=TRY', parse: d => d && d.rates && d.rates.TRY }
  ];

  for (const src of sources){
    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 8000);
      const res = await fetch(src.url, { signal: controller.signal });
      clearTimeout(timeoutId);
      if (!res.ok) continue;
      const data = await res.json();
      const rate = src.parse(data);
      if (typeof rate === 'number' && rate > 0){
        usdTryRate = rate;
        rateStatus = 'ok';
        recalc();
        return;
      }
    } catch (e) {
      // bu kaynak başarısız oldu, sıradaki kaynağı dene
    }
  }

  usdTryRate = null;
  rateStatus = 'error';
  recalc();
}

      : 'blok sistemi (1-6: 150 TL, 7-11: 60 TL, 12: 50 TL)';

      ? `first 5 letters ${money(100)} each, then ${money(70)} each`
      : 'ilk 5 harf 100 TL, sonrası 70 TL';

    return locale === 'intl'
      ? `first 5 pcs ${money(300)} each, then ${money(210)} each`
      : 'ilk 5 adet 300 TL, sonrası 210 TL';
  }
  return money(p.price);
}

  PRODUCTS.forEach(p => {
    const row = document.createElement('div');
    row.className = 'product-row';
    row.innerHTML = `

      </div>
      <div class="stepper">

}

function renderResult(result){
  const box = document.getElementById('resultBox');
  const { anaSetSonuc, tarakSonuc, kapiSusuCost, harfMagnetCost, bubbleHarfCost, ciftIsimCost,
          extraServices, extraServicesTotal, hasDiscount, discountDesc, appliedDiscount,
          araToplam, finalToplam } = result;

  const usedSets = anaSetSonuc.counts
    .map((c, i) => ({ c, name: sname(i), price: SETS[i].price }))
    .filter(x => x.c > 0);

  const rem = anaSetSonuc.remaining;
  const hasIndividual = (rem.tavsan || rem.yaka || rem.ciftYaka || rem.teddy || rem.buyukSapka || rem.kucukSapka
                       || tarakSonuc.kalanKeci || tarakSonuc.kalanBambu
                       || state.kapiSusu || state.harfMagnet || state.bubbleHarf || state.ciftIsim);

  let html = '';

  if (usedSets.length === 0 && tarakSonuc.setSayisi === 0 && !hasIndividual && extraServices.length === 0 && !hasDiscount){
    box.innerHTML = `<div class="empty-msg">${tr('emptyMsg')}</div>`;
    return;
  }

  if (usedSets.length){

  if (hasIndividual){
    html += `<div class="result-line head">${tr('resultHeadProducts')}</div>`;

    if (rem.ciftYaka)   html += `<div class="result-line"><span>${rem.ciftYaka} × ${pname('ciftYaka')}</span><span>${money(rem.ciftYaka * PRICES.ciftYaka)}</span></div>`;
    if (rem.teddy)      html += `<div class="result-line"><span>${rem.teddy} × ${pname('teddy')}</span><span>${money(rem.teddy * PRICES.teddy)}</span></div>`;
    if (rem.buyukSapka) html += `<div class="result-line"><span>${rem.buyukSapka} × ${pname('buyukSapka')}</span><span>${money(rem.buyukSapka * PRICES.buyukSapka)}</span></div>`;

    if (rem.kucukSapka){
      const full = Math.floor(rem.kucukSapka / HAT_BLOCK_SIZE);
      const partial = rem.kucukSapka % HAT_BLOCK_SIZE;
      html += `<div class="result-line"><span>${rem.kucukSapka} × ${pname('kucukSapka')}</span><span>${money(hatBlockCost(rem.kucukSapka))}</span></div>`;
      if (full)    html += `<div class="result-line sub"><span>${full} × 12</span><span>${money(full * HAT_BLOCK_TOTAL)}</span></div>`;
      if (partial) html += `<div class="result-line sub"><span>${partial}</span><span>${money(partialHatBlockCost(partial))}</span></div>`;
    }

    if (tarakSonuc.kalanKeci)  html += `<div class="result-line"><span>${tarakSonuc.kalanKeci} × ${pname('keciKiliTarak')}</span><span>${money(tarakSonuc.kalanKeci * PRICES.keciKiliTarak)}</span></div>`;
    if (tarakSonuc.kalanBambu) html += `<div class="result-line"><span>${tarakSonuc.kalanBambu} × ${pname('bambuTarak')}</span><span>${money(tarakSonuc.kalanBambu * PRICES.bambuTarak)}</span></div>`;
    if (state.kapiSusu)        html += `<div class="result-line"><span>${state.kapiSusu} × ${pname('kapiSusu')}</span><span>${money(kapiSusuCost)}</span></div>`;

    if (state.harfMagnet){
      const hb = harfMagnetBreakdown(state.harfMagnet);
      html += `<div class="result-line"><span>${state.harfMagnet} × ${pname('harfMagnet')}</span><span>${money(harfMagnetCost)}</span></div>`;
      if (hb.first) html += `<div class="result-line sub"><span>${hb.first}</span><span>${money(hb.firstCost)}</span></div>`;
      if (hb.extra) html += `<div class="result-line sub"><span>${hb.extra}</span><span>${money(hb.extraCost)}</span></div>`;

    if (state.bubbleHarf){

      html += `<div class="result-line"><span>${state.bubbleHarf} × ${pname('bubbleHarf')}</span><span>${money(bubbleHarfCost)}</span></div>`;
      if (bb.first) html += `<div class="result-line sub"><span>${bb.first}</span><span>${money(bb.firstCost)}</span></div>`;
      if (bb.extra) html += `<div class="result-line sub"><span>${bb.extra}</span><span>${money(bb.extraCost)}</span></div>`;
    }

    if (state.ciftIsim) html += `<div class="result-line"><span>${state.ciftIsim} × ${pname('ciftIsim')}</span><span>${money(ciftIsimCost)}</span></div>`;

  if (hasDiscount){
    html += `<div class="result-line head">${tr('resultHeadDiscount')}</div>`;
    html += `<div class="result-line"><span>${discountDesc}</span><span>-${rawMoney(appliedDiscount)}</span></div>`;

    });

  if (locale === 'intl'){
    const shippingVal = Number(state.intlShipping) || 0;
    if (shippingVal > 0){
      html += `<div class="result-line head">${tr('resultHeadShipping')}</div>`;
      html += `<div class="result-line"><span>${tr('resultHeadShipping')}</span><span>${rawMoney(shippingVal)}</span></div>`;
    }
  }

  html += `<div class="dashed"></div>`;

  if (locale === 'intl'){
    // Güncelleme 28 düzeltmesi: Subtotal, ekranda gösterilen (zaten yuvarlanmış) satırların
    // TOPLAMIDIR — TL toplamının yeniden çevrilmesi DEĞİL. Bu yüzden burada money(araToplam)
    // yerine computeIntlSubtotal(result) kullanılır.
    const intlSubtotal = computeIntlSubtotal(result);
    const shippingVal = Number(state.intlShipping) || 0;
    html += `<div class="result-line sub"><span>${tr('subtotalLabel')}</span><span>${fmtDisplay(intlSubtotal)}</span></div>`;

    let total = intlSubtotal + shippingVal;
    if (vatEnabled){
      // Güncelleme 47: VAT = ((Ürün Toplamı + Kargo) × %15) + güncel kurdan 4.50 USD.
      const vat = computeVat(intlSubtotal, shippingVal);
      if (vat.ok){
        html += `<div class="result-line sub"><span>${tr('vatLine')}</span><span>${fmtDisplay(vat.amount)}</span></div>`;

      // Kullanıcıya durum, VAT toggle'ının altındaki uyarı notuyla ayrıca bildirilir.
    }
    html += `<div class="grand"><span>${tr('totalLine')}</span><span>${fmtDisplay(total)}</span></div>`;
  } else {
    // Türkiye modu tamamen değişmeden devam eder (Güncelleme 31/35).
    html += `<div class="result-line sub"><span>${tr('subtotalLabel')}</span><span>${money(araToplam)}</span></div>`;
    const diff = finalToplam - araToplam;
    if (diff !== 0) html += `<div class="result-line sub"><span>${tr('roundingLabel')}</span><span>${diff > 0 ? '+' : ''}${fmt(diff)} ${tr('currency')}</span></div>`;
    html += `<div class="grand"><span>${tr('totalLine')}</span><span>${money(finalToplam)}</span></div>`;
  }

  box.innerHTML = html;

/* =========================================================
   10. MÜŞTERİ MESAJI OLUŞTURMA
   ========================================================= */

// Sete ait içerik satırlarını, tarak birleşimini, Uyku Arkadaşı+Boyunluk birleşimini,
// ek hizmetleri ve indirimi içeren ürün satırlarını üretir. TR ve EN mesajları bu ortak
// listeyi kullanır — yalnızca isimler/para birimi locale'e göre değişir, sıra ve mantık aynıdır.
function buildProductLines(result){
  const { anaSetSonuc, tarakSonuc, ciftIsimCost, extraServices, hasDiscount, discountDesc, appliedDiscount } = result;
  const lines = [];
  const cNames = contentNames();
  const tNames = tarakContentNames();
  const pouchWord = locale === 'intl' ? 'Pouch' : 'Kese';

  // Bir setin/otomatik setin içeriğini "   • 2 Ürün Adı" biçiminde, aralarında boş satırlarla ekler.
  // İngilizce'de adet 1'den fazlaysa isim basitçe çoğullanır (örn. "12 Milestone Hats").
  function pushContentLines(order, displayNames, requires, count){
    lines.push('');
    order.forEach(key => {
      const qty = (requires[key] || 0) * count;
      if (qty > 0){
        let itemName = displayNames[key];
        if (locale === 'intl' && qty !== 1 && !itemName.endsWith('s')) itemName += 's';
        lines.push(`   • ${qty} ${itemName}`);
      }
    });
    lines.push('');
  }

  // Güncelleme 20: setler her zaman en yüksek fiyatlıdan en düşüğe doğru gösterilir.
  // Bu yalnızca gösterim sırasıdır; hangi kombinasyonun seçildiğini optimizeAnaSetler belirler.
  MESSAGE_SET_DISPLAY_ORDER.forEach(id => {
    const i = SETS.findIndex(s => s.id === id);
    const c = anaSetSonuc.counts[i];
    if (c > 0){
      lines.push(`• ${c} × ${sname(i)} — ${money(c * SETS[i].price)}`);
      pushContentLines(SETS[i].contentOrder, cNames, SETS[i].requires, c);
    }
  });

  // Tarak Seti: Kese/Pouch ürünle birlikte ücretsiz gelir, ürün adının parçası olarak tek satırda gösterilir.
  if (tarakSonuc.setSayisi > 0){
    lines.push(`• ${tarakSonuc.setSayisi} × ${tarakSetName()} + ${pouchWord} — ${money(tarakSonuc.setSayisi * TARAK_SET.price)}`);
    pushContentLines(TARAK_SET_CONTENT_ORDER, tNames, TARAK_SET.requires, tarakSonuc.setSayisi);
  }

  // Uyku Arkadaşı + Boyunluk birleştirme (Güncelleme 15-16): yalnızca mesaj görünümü içindir,
  // set fiyatlarını veya hesaplama motorunu etkilemez. Eşleşen adet kadar tek satırda,
  // kalan (eşleşmeyen) adet ayrı satırda gösterilir.
  function mergeAndPush(countA, nameA, priceA, countB, nameB, priceB){
    const merged = Math.min(countA, countB);
    const extraA = countA - merged;
    const extraB = countB - merged;
    if (merged > 0) lines.push(`• ${merged} × ${nameA} + ${nameB} — ${money(merged * (priceA + priceB))}`);
    if (extraA > 0) lines.push(`• ${extraA} × ${nameA} — ${money(extraA * priceA)}`);
    if (extraB > 0) lines.push(`• ${extraB} × ${nameB} — ${money(extraB * priceB)}`);
  }

  const rem = anaSetSonuc.remaining;
  mergeAndPush(rem.tavsan || 0, pname('tavsan'), PRICES.tavsan, rem.yaka || 0, pname('yaka'), PRICES.yaka);
  mergeAndPush(rem.teddy || 0, pname('teddy'), PRICES.teddy, rem.ciftYaka || 0, pname('ciftYaka'), PRICES.ciftYaka);

  if (rem.buyukSapka) lines.push(`• ${rem.buyukSapka} × ${pname('buyukSapka')} — ${money(rem.buyukSapka * PRICES.buyukSapka)}`);
  if (rem.kucukSapka) lines.push(`• ${rem.kucukSapka} × ${pname('kucukSapka')} — ${money(hatBlockCost(rem.kucukSapka))}`);
  if (tarakSonuc.kalanKeci)  lines.push(`• ${tarakSonuc.kalanKeci} × ${pname('keciKiliTarak')} + ${pouchWord} — ${money(tarakSonuc.kalanKeci * PRICES.keciKiliTarak)}`);
  if (tarakSonuc.kalanBambu) lines.push(`• ${tarakSonuc.kalanBambu} × ${pname('bambuTarak')} + ${pouchWord} — ${money(tarakSonuc.kalanBambu * PRICES.bambuTarak)}`);
  if (state.kapiSusu)   lines.push(`• ${state.kapiSusu} × ${pname('kapiSusu')} — ${money(state.kapiSusu * PRICES.kapiSusu)}`);
  if (state.harfMagnet) lines.push(`• ${state.harfMagnet} × ${pname('harfMagnet')} — ${money(harfMagnetCost(state.harfMagnet))}`);
  if (state.bubbleHarf) lines.push(`• ${state.bubbleHarf} × ${pname('bubbleHarf')} — ${money(bubbleHarfCost(state.bubbleHarf))}`);
  if (state.ciftIsim)   lines.push(`• ${state.ciftIsim} × ${pname('ciftIsim')} — ${money(ciftIsimCost)}`);

  // Ek Hizmet / Ek Ücret (Güncelleme 23): indirimden sonra gösterilir (Güncelleme 34).
  // İndirim (Güncelleme 22): "İndirim (Açıklama) — -XXX TL" biçiminde, ürünlerden hemen sonra (Güncelleme 34).
  if (hasDiscount){
    lines.push(`• ${tr('resultHeadDiscount')} (${discountDesc}) — -${rawMoney(appliedDiscount)}`);
  }
  extraServices.forEach(x => {
    lines.push(`• ${x.desc} — ${rawMoney(Number(x.price))}`);
  });

  return lines;
}

function buildMessage(result){
  const { finalToplam } = result;
  const productLines = buildProductLines(result);
  const lines = [];

  // Ürünler (setler, tarak seti, birleştirilmiş/tekil ürünler, indirim, ek hizmet — bu sıradadır).
  lines.push(...productLines);

  if (locale === 'tr'){
    // Güncelleme 32: sade yapı — yalnızca ürünler, kargo (son satır) ve toplam.
    lines.push(`• 📦 Kargo — ${money(SABIT_MESAJ.kargo)}`);
    lines.push('');
    lines.push('━━━━━━━━━━━━━━');
    lines.push('');
    lines.push(`🌸 Toplam Tutar: ${money(finalToplam + SABIT_MESAJ.kargo)}`);
  } else {
    // Güncelleme 51/53: Shipping her zaman ürünlerin son satırıdır (VAT açık/kapalı farketmez).
    // Güncelleme 28 düzeltmesi: Subtotal, satır bazlı (zaten yuvarlanmış) tutarların toplamıdır.
    const shippingVal = Number(state.intlShipping) || 0;

    if (shippingVal > 0){
      lines.push(`• 📦 Shipping — ${rawMoney(shippingVal)}`);
    } else {
      lines.push(`• 📦 Shipping — Calculated Separately`);
    }
    lines.push('');
    lines.push('━━━━━━━━━━━━━━');
    lines.push('');

    const intlSubtotal = computeIntlSubtotal(result);
    lines.push(`${tr('subtotalLabel')}: ${fmtDisplay(intlSubtotal)}`);

    if (vatEnabled){
      // Güncelleme 47/49: VAT = ((Ürün Toplamı + Kargo) × %15) + güncel kurdan 4.50 USD.
      // Güncelleme 50: müşteriye yalnızca "VAT: XXXX TRY" gösterilir, formül/kur asla gösterilmez.
      const vat = computeVat(intlSubtotal, shippingVal);
      if (vat.ok){
        lines.push(`${tr('vatLine')}: ${fmtDisplay(vat.amount)}`);
        lines.push(`🌸 ${tr('totalLine')}: ${fmtDisplay(intlSubtotal + shippingVal + vat.amount)}`);
      } else {
        // Güncel kur alınamadı: VAT satırı gösterilmez, toplam VAT'sız hesaplanır.
        // Arayüzde (Price Breakdown üstünde) ayrıca uyarı gösterilir.
        lines.push(`🌸 ${tr('totalLine')}: ${fmtDisplay(intlSubtotal + shippingVal)}`);
      }
    } else {
      lines.push(`🌸 ${tr('totalLine')}: ${fmtDisplay(intlSubtotal + shippingVal)}`);
    }
  }

  // Art arda gelen boş satırları (örn. bir set içeriğinin hemen ardından ayraç geldiğinde) tek satıra indirger.
  const collapsed = lines.filter((l, i) => !(l === '' && lines[i - 1] === ''));

  return collapsed.join('\n');
}

let toastTimer = null;
function showToast(text){
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

/* =========================================================
   12. ANA YENİDEN HESAPLAMA DÖNGÜSÜ
   ========================================================= */

function recalc(){
  const result = optimizeAll(state);

  let displayTotal;
  if (locale === 'intl'){
    // VAT açıksa ve kur henüz hiç denenmediyse arka planda çekmeyi başlat (Güncelleme 48).
    if (vatEnabled && rateStatus === 'idle') fetchUsdTryRate();

    // Güncelleme 28 düzeltmesi: aynı satır-bazlı toplam mantığı burada da kullanılır.
    const intlSubtotal = computeIntlSubtotal(result);
    const shippingVal = Number(state.intlShipping) || 0;

    if (vatEnabled){
      const vat = computeVat(intlSubtotal, shippingVal);
      displayTotal = intlSubtotal + shippingVal + (vat.ok ? vat.amount : 0);
    } else {
      displayTotal = intlSubtotal + shippingVal;
    }
  } else {
    displayTotal = result.finalToplam; // Türkiye modu değişmeden devam eder
  }

  document.getElementById('totalAmount').innerHTML = fmtDisplay(displayTotal).replace(
    new RegExp(`${tr('currency')}$`), `<span>${tr('currency')}</span>`
  );
  renderResult(result);
  document.getElementById('msgBox').textContent = buildMessage(result);
  updateVatStatusNote();
}

document.getElementById('btnCopy').addEventListener('click', () => {
  const text = document.getElementById('msgBox').textContent;
  const fallbackCopy = () => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { document.execCommand('copy'); showToast(tr('toastCopied')); }
    catch (e) { showToast(tr('toastCopyFail')); }
    document.body.removeChild(ta);
  };

  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => showToast(tr('toastCopied'))).catch(fallbackCopy);
  } else {
    fallbackCopy();
  }
});

function escAttr(str){
  return String(str == null ? '' : str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

function renderExtraServices(){
  const list = document.getElementById('extraServiceList');
  list.innerHTML = '';
  state.extraServices.forEach((item, idx) => {
    const row = document.createElement('div');
    row.className = 'extra-row';
    row.innerHTML = `
      <input type="text" class="field-input" data-idx="${idx}" data-field="desc" placeholder="${tr('extraDescPlaceholder')}" value="${escAttr(item.desc)}">
      <input type="number" class="field-input amount" data-idx="${idx}" data-field="price" placeholder="${tr('extraPricePlaceholder')}" min="0" value="${escAttr(item.price)}">
      <button class="extra-remove" data-idx="${idx}" aria-label="sil">×</button>
    `;
    list.appendChild(row);
  });
  list.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('input', () => {
      const idx = parseInt(inp.dataset.idx, 10);
      state.extraServices[idx][inp.dataset.field] = inp.value;
      recalc();
    });
  });
  list.querySelectorAll('.extra-remove').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.idx, 10);
      state.extraServices.splice(idx, 1);
      renderExtraServices();
      recalc();
    });
  });
}

document.getElementById('btnAddExtra').addEventListener('click', () => {

  document.getElementById('qsTarak2Kese').textContent = tr('quickBtnTarak2Kese');
  document.getElementById('txtUrunlerTitle').textContent = tr('urunlerTitle');
  document.getElementById('txtIndirimTitle').textContent = tr('indirimTitle');
  document.getElementById('discountDesc').placeholder = tr('discountDescPlaceholder');
  document.getElementById('discountAmount').placeholder = tr('discountAmountPlaceholder');
  document.getElementById('txtEkHizmetTitle').textContent = tr('ekHizmetTitle');
  document.getElementById('btnAddExtra').textContent = tr('extraAddBtn');
  document.getElementById('txtFiyatDokumuTitle').textContent = tr('fiyatDokumuTitle');
  document.getElementById('txtMusteriMesajiTitle').textContent = tr('musteriMesajiTitle');
  document.getElementById('btnCopy').textContent = tr('btnCopy');
  document.getElementById('btnPrint').textContent = tr('btnPrint');
  document.getElementById('btnClear').textContent = tr('btnClear');
  document.getElementById('txtVatLabel').textContent = tr('vatLabel');

  // KDV toggle'ı yalnızca Yurtdışı Modunda görünür (Güncelleme 29, 35). TR moduna dönüldüğünde
  // gizlenir; VAT hiçbir zaman Türkiye modunda hesaplamayı etkilemez (bkz. renderResult/buildMessage).
  document.getElementById('vatCard').style.display = (locale === 'intl') ? 'flex' : 'none';

  // Kargo/Shipping alanı da yalnızca Yurtdışı Modunda görünür.
  document.getElementById('shippingCard').style.display = (locale === 'intl') ? 'block' : 'none';
  document.getElementById('txtShippingTitle').textContent = tr('shippingTitle');
  document.getElementById('intlShippingCost').placeholder = tr('shippingPlaceholder');

  renderExtraServices();
}

document.getElementById('swLocale').addEventListener('click', function(){
  locale = locale === 'tr' ? 'intl' : 'tr';
  this.classList.toggle('on', locale === 'intl');
  document.documentElement.lang = locale === 'intl' ? 'en' : 'tr';
  applyStaticTexts();
  renderProducts();
  recalc();
});

document.getElementById('swVat').addEventListener('click', function(){
  vatEnabled = !vatEnabled;
  this.classList.toggle('on', vatEnabled);
  // VAT açıldıysa ve kur daha önce alınamadıysa (veya hiç denenmediyse) tekrar dene.
  if (vatEnabled && locale === 'intl' && rateStatus !== 'ok' && rateStatus !== 'loading'){
    fetchUsdTryRate();
  }
  recalc();
});

// VAT toggle'ının altında, kur çekme durumuna göre (yükleniyor / hata / gizli) not gösterir.
function updateVatStatusNote(){
  const note = document.getElementById('vatStatusNote');
  if (locale !== 'intl' || !vatEnabled || rateStatus === 'ok'){
    note.style.display = 'none';
    note.innerHTML = '';
    return;
  }
  note.style.display = 'block';
  if (rateStatus === 'loading'){
    note.className = 'vat-note loading';
    note.textContent = tr('vatRateLoading');
  } else {
    note.className = 'vat-note error';
    note.innerHTML = `${tr('vatRateError')} <a id="vatRetryLink">${tr('vatRetry')}</a>`;
    const retryLink = document.getElementById('vatRetryLink');
    if (retryLink) retryLink.addEventListener('click', () => fetchUsdTryRate());
  }
}

document.getElementById('intlShippingCost').addEventListener('input', (e) => {
  state.intlShipping = e.target.value;
  recalc();
});

/* =========================================================
   17. BAŞLANGIÇ
   ========================================================= */

applyStaticTexts();
renderProducts();
recalc();
</script>
</body>
</html>
