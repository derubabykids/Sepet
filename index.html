<style>
  :root{
    --ink:#231916;
    --paper:#ffffff;
    --rose:#c96b7d;
    --rose-deep:#8a3f52;
    --blush:#faf1ef;
    --line:#ece3e0;

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;

  header{text-align:center;margin-bottom:20px;}
  header h1{

<div class="toast" id="toast">Kopyalandı</div>

<script>
/* =========================================================
   1. VERİ YAPILARI (DATA)
   ========================================================= */

// Sabit fiyatlı, doğrudan çarpılan ürünler
const PRICES = {
  tavsan: 600,
  yaka: 200,
  ciftYaka: 300,
  buyukSapka: 350,
  teddy: 800,
  keciKiliTarak: 720,
  bambuTarak: 840,
  kapiSusu: 1600,
  harfMagnet: null, // özel kademeli fiyat sistemi (aşağıda)
  ciftIsim: 100
};

// Ekranda gösterilecek ürün listesi (kolayca yeni ürün eklenebilir)
const PRODUCTS = [
  { id: 'tavsan',        name: 'Peluş Tavşan',       price: PRICES.tavsan },
  { id: 'yaka',          name: 'Yaka',                price: PRICES.yaka },
  { id: 'ciftYaka',      name: 'Çift Yaka',           price: PRICES.ciftYaka },
  { id: 'kucukSapka',    name: 'Küçük Şapka',         price: null }, // özel blok sistemi
  { id: 'buyukSapka',    name: 'Büyük Şapka',         price: PRICES.buyukSapka },
  { id: 'teddy',         name: 'Teddy Peluş',         price: PRICES.teddy },
  { id: 'keciKiliTarak', name: 'Keçi Kılı Tarak',     price: PRICES.keciKiliTarak },
  { id: 'bambuTarak',    name: 'Bambu Tarak',         price: PRICES.bambuTarak },
  { id: 'kapiSusu',      name: 'Kapı / Duvar Süsü',   price: PRICES.kapiSusu },
  { id: 'harfMagnet',    name: 'Harf Magnet',         price: null }, // özel kademeli fiyat sistemi
  { id: 'ciftIsim',      name: 'Çift İsim',           price: PRICES.ciftIsim }
];

// Ana setler — her biri "requires" içinde hangi üründen kaç adet tükettiğini tanımlar.
// Yeni bir set eklemek için bu diziye bir obje eklemek yeterlidir.
const SETS = [
  { id: 'yasSeti',        name: 'Yaş / 6 Aylık Set',       price: 1300, requires: { tavsan: 1, yaka: 1, kucukSapka: 1, buyukSapka: 1 },
    contentOrder: ['tavsan','buyukSapka','kucukSapka','yaka'] },
  { id: 'aylikSet',       name: '12 Aylık Set',            price: 2400, requires: { tavsan: 1, yaka: 1, buyukSapka: 1, kucukSapka: 12 },
    contentOrder: ['tavsan','buyukSapka','kucukSapka','yaka'] },
  { id: 'teddyYasSeti',   name: 'Teddy Yaş / 6 Aylık Set', price: 1600, requires: { teddy: 1, ciftYaka: 1, kucukSapka: 1, buyukSapka: 1 },
    contentOrder: ['teddy','buyukSapka','kucukSapka','ciftYaka'] },
  { id: 'teddyAylikSet',  name: 'Teddy 12 Aylık Set',      price: 2700, requires: { teddy: 1, ciftYaka: 1, buyukSapka: 1, kucukSapka: 12 },
    contentOrder: ['teddy','buyukSapka','kucukSapka','ciftYaka'] }
];

// Müşteri mesajında set içeriğini okunabilir isimlerle göstermek için kullanılan eşleme.
// Sadece görüntüleme amaçlıdır — fiyatlandırmayı etkilemez.
const CONTENT_DISPLAY_NAMES = {
  tavsan: 'Peluş Tavşan',
  teddy: 'Teddy Peluş',
  yaka: 'Boyunluk',
  ciftYaka: 'Çift Kat Boyunluk',
  buyukSapka: 'İsimli Bebek Şapkası',
  kucukSapka: 'Oyuncak Şapkası'
};

// Tarak Seti için de aynı içerik gösterimi (otomatik oluşturulan setler dahil)
const TARAK_SET_CONTENT_ORDER = ['keciKiliTarak', 'bambuTarak'];
const TARAK_CONTENT_DISPLAY_NAMES = {
  keciKiliTarak: 'Keçi Kılı Tarak',
  bambuTarak: 'Bambu Tarak'
};

// Tarak otomatik seti (kullanıcı bunu seçmez, sistem kendisi oluşturur)
const TARAK_SET = { name: "2'li Tarak Seti", price: 1400, requires: { keciKiliTarak: 1, bambuTarak: 1 } };

// Küçük Şapka blok içi birim fiyatlar (1..12. şapka sırasıyla)
// 1-6: 150 TL sabit / 7-11: 60 TL sabit / 12: 50 TL
const HAT_UNIT_PRICES = [150,150,150,150,150,150, 60,60,60,60,60, 50];
const HAT_BLOCK_SIZE = 12;
const HAT_BLOCK_TOTAL = HAT_UNIT_PRICES.reduce((a,b)=>a+b,0); // 1250 TL

const SABIT_MESAJ = {
  kargo: 120,
  hazirlik: '15 iş günü',
  ciftIsimNotu: 'Çift uzun isimlerde +100 TL eklenmiştir.'
};

/* =========================================================
   2. DURUM (STATE)
   ========================================================= */

let state = {};
PRODUCTS.forEach(p => state[p.id] = 0);

/* =========================================================
   3. KÜÇÜK ŞAPKA BLOK HESAPLAMA SİSTEMİ
   ========================================================= */

// Bir bloğun içindeki ilk k adet şapkanın toplam fiyatı (k: 0-12 arası)
function partialHatBlockCost(k){
  if (k <= 0) return 0;
  let total = 0;
  for (let i = 0; i < k; i++) total += HAT_UNIT_PRICES[i];
  return total;
}

// n adet küçük şapkanın toplam fiyatı — bloklar birbirinden bağımsızdır.
// 13. şapka yeni blok başlatır, 25. şapka yeni blok başlatır, vs.
function hatBlockCost(n){
  if (n <= 0) return 0;
  const fullBlocks = Math.floor(n / HAT_BLOCK_SIZE);
  const remainder = n % HAT_BLOCK_SIZE;
  return (fullBlocks * HAT_BLOCK_TOTAL) + partialHatBlockCost(remainder);
}

// İlk 6 harfin HER BİRİ 100 TL, 7. harften itibaren HER BİRİ 70 TL.
// Not: Küçük Şapka'nın aksine bu sistemde blok/sıfırlama yoktur — kademe tek seferde uygulanır.
function harfMagnetCost(n){
  if (n <= 0) return 0;
  if (n <= 6) return n * 100;
  return (6 * 100) + ((n - 6) * 70);
}

// Ekranda gösterim için: kaç harf ilk kademede (100 TL), kaç harf ikinci kademede (70 TL)
function harfMagnetBreakdown(n){
  const first = Math.min(n, 6);
  const extra = Math.max(n - 6, 0);
  return { first, extra, firstCost: first * 100, extraCost: extra * 70 };
}

/* =========================================================
   4. TARAK OTOMATİK SET OLUŞTURMA
   ========================================================= */

// Mümkün olan en fazla sayıda "2'li Tarak Seti" oluşturur (her set 1 keçi kılı + 1 bambu tarak).
// Bir set her zaman iki ürünü ayrı ayrı almaktan daha ucuzdur (1400 < 720+840), bu yüzden
// maksimum eşleştirme her zaman minimum fiyatı verir.
function optimizeTarakSeti(keciKiliAdet, bambuAdet){
  const setSayisi = Math.min(keciKiliAdet, bambuAdet);
  const kalanKeci = keciKiliAdet - setSayisi;
  const kalanBambu = bambuAdet - setSayisi;
  const cost = (setSayisi * TARAK_SET.price)
             + (kalanKeci * PRICES.keciKiliTarak)
             + (kalanBambu * PRICES.bambuTarak);
  return { setSayisi, kalanKeci, kalanBambu, cost };
}

/* =========================================================
   5. ANA SET OPTİMİZASYON MOTORU (Recursive Backtracking)
   ========================================================= */

// Sette yer almayan kalan ürünlerin (tavşan, yaka, çift yaka, teddy, büyük şapka, küçük şapka)
// fiyatını hesaplar. Küçük şapka için blok sistemi burada devreye girer.
function leftoverCost(inv){
  return (inv.tavsan    || 0) * PRICES.tavsan
       + (inv.yaka      || 0) * PRICES.yaka
       + (inv.ciftYaka  || 0) * PRICES.ciftYaka
       + (inv.teddy     || 0) * PRICES.teddy
       + (inv.buyukSapka|| 0) * PRICES.buyukSapka
       + hatBlockCost(inv.kucukSapka || 0);
}

// Tüm set kombinasyonlarını (SETS dizisindeki her set için 0..maksimum adet) tam arama ile dener.
// Greedy DEĞİLDİR: "en çok set" değil, "en düşük toplam fiyat" veren kombinasyon seçilir.
// Eşit fiyatlı durumlarda, setleri kullanan kombinasyon tercih edilir (döküm ekranında anlamlı olması için).
function optimizeAnaSetler(inventory){
  let best = null;
  const n = SETS.length;
  const SAFETY_CAP = 40; // gerçekçi sipariş adetleri için güvenlik sınırı

  function maxPossible(setIdx, inv){
    const req = SETS[setIdx].requires;
    let max = Infinity;
    for (const key in req) {
      max = Math.min(max, Math.floor((inv[key] || 0) / req[key]));
    }
    if (max === Infinity) max = 0;
    return Math.min(max, SAFETY_CAP);
  }

  function backtrack(idx, inv, costSoFar, counts){
    if (idx === n){
      const total = costSoFar + leftoverCost(inv);
      if (best === null || total <= best.cost){
        best = { counts: counts.slice(), cost: total, remaining: Object.assign({}, inv) };
      }
      return;
    }
    const cap = maxPossible(idx, inv);
    for (let c = 0; c <= cap; c++){
      const newInv = Object.assign({}, inv);
      const req = SETS[idx].requires;
      for (const key in req) newInv[key] -= req[key] * c;
      counts.push(c);
      backtrack(idx + 1, newInv, costSoFar + (c * SETS[idx].price), counts);
      counts.pop();
    }
  }

  backtrack(0, Object.assign({}, inventory), 0, []);
  return best;
}

/* =========================================================
   6. TOPLU OPTİMİZASYON — TÜM MOTORU BİRLEŞTİRİR
   ========================================================= */

function optimizeAll(s){
  const anaSetSonuc = optimizeAnaSetler(s);
  const tarakSonuc = optimizeTarakSeti(s.keciKiliTarak || 0, s.bambuTarak || 0);
  const kapiSusuCost = (s.kapiSusu || 0) * PRICES.kapiSusu;
  const harfMagnetTotal = harfMagnetCost(s.harfMagnet || 0);
  const ciftIsimCost = (s.ciftIsim || 0) * PRICES.ciftIsim;

  const araToplam = anaSetSonuc.cost + tarakSonuc.cost + kapiSusuCost + harfMagnetTotal + ciftIsimCost;
  const finalToplam = Math.round(araToplam / 10) * 10; // yuvarlama sadece en sonda
  const kargoDahilToplam = finalToplam + SABIT_MESAJ.kargo; // sadece müşteri mesajında kullanılır

  return {
    anaSetSonuc,
    tarakSonuc,
    kapiSusuCost,
    harfMagnetCost: harfMagnetTotal,
    ciftIsimCost,
    araToplam,
    finalToplam,
    kargoDahilToplam
  };
}

/* =========================================================
   7. YARDIMCI FONKSİYONLAR
   ========================================================= */

function fmt(n){ return n.toLocaleString('tr-TR'); }

function setName(idx){ return SETS[idx].name; }

function priceLabel(p){
  if (p.id === 'kucukSapka') return 'blok sistemi (1-6: 150 TL, 7-11: 60 TL, 12: 50 TL)';
  if (p.id === 'harfMagnet') return 'ilk 6 harf 100 TL, sonrası 70 TL';
  return fmt(p.price) + ' TL';
}

/* =========================================================
   8. RENDER — ÜRÜN LİSTESİ
   ========================================================= */

function renderProducts(){
  const list = document.getElementById('productList');
  list.innerHTML = '';
  PRODUCTS.forEach(p => {
    const row = document.createElement('div');
    row.className = 'product-row';
    row.innerHTML = `
      <div class="info">
        <div class="name">${p.name}</div>
        <div class="price">${priceLabel(p)}</div>
      </div>
      <div class="stepper">
        <button data-id="${p.id}" data-dir="-1" aria-label="azalt">−</button>
        <div class="qty" id="qty-${p.id}">${state[p.id]}</div>
        <button data-id="${p.id}" data-dir="1" aria-label="arttır">+</button>
      </div>`;
    list.appendChild(row);
  });
  list.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      const dir = parseInt(btn.dataset.dir, 10);
      state[id] = Math.max(0, state[id] + dir);
      document.getElementById('qty-' + id).textContent = state[id];
      recalc();
    });
  });
}

/* =========================================================
   9. RENDER — FİYAT DÖKÜMÜ
   ========================================================= */

function renderResult(result){
  const box = document.getElementById('resultBox');
  const { anaSetSonuc, tarakSonuc, kapiSusuCost, harfMagnetCost, ciftIsimCost, araToplam, finalToplam } = result;

  const usedSets = anaSetSonuc.counts
    .map((c, i) => ({ c, name: SETS[i].name, price: SETS[i].price }))
    .filter(x => x.c > 0);

  const rem = anaSetSonuc.remaining;
  const hasIndividual = (rem.tavsan || rem.yaka || rem.ciftYaka || rem.teddy || rem.buyukSapka || rem.kucukSapka
                       || tarakSonuc.kalanKeci || tarakSonuc.kalanBambu
                       || state.kapiSusu || state.harfMagnet || state.ciftIsim);

  let html = '';

  if (usedSets.length === 0 && tarakSonuc.setSayisi === 0 && !hasIndividual){
    box.innerHTML = '<div class="empty-msg">Henüz ürün seçilmedi</div>';
    return;
  }

  if (usedSets.length){
    html += `<div class="result-line head">Kullanılan Setler</div>`;
    usedSets.forEach(x => {
      html += `<div class="result-line"><span>${x.c} × ${x.name}</span><span>${fmt(x.c * x.price)} TL</span></div>`;
    });
  }

  if (tarakSonuc.setSayisi > 0){
    html += `<div class="result-line head">Oluşturulan Otomatik Setler</div>`;
    html += `<div class="result-line"><span>${tarakSonuc.setSayisi} × ${TARAK_SET.name}</span><span>${fmt(tarakSonuc.setSayisi * TARAK_SET.price)} TL</span></div>`;
  }

  if (hasIndividual){
    html += `<div class="result-line head">Kullanılan Ürünler</div>`;
    if (rem.tavsan)     html += `<div class="result-line"><span>${rem.tavsan} × Peluş Tavşan</span><span>${fmt(rem.tavsan * PRICES.tavsan)} TL</span></div>`;
    if (rem.yaka)       html += `<div class="result-line"><span>${rem.yaka} × Yaka</span><span>${fmt(rem.yaka * PRICES.yaka)} TL</span></div>`;
    if (rem.ciftYaka)   html += `<div class="result-line"><span>${rem.ciftYaka} × Çift Yaka</span><span>${fmt(rem.ciftYaka * PRICES.ciftYaka)} TL</span></div>`;
    if (rem.teddy)      html += `<div class="result-line"><span>${rem.teddy} × Teddy Peluş</span><span>${fmt(rem.teddy * PRICES.teddy)} TL</span></div>`;
    if (rem.buyukSapka) html += `<div class="result-line"><span>${rem.buyukSapka} × Büyük Şapka</span><span>${fmt(rem.buyukSapka * PRICES.buyukSapka)} TL</span></div>`;

    if (rem.kucukSapka){
      const full = Math.floor(rem.kucukSapka / HAT_BLOCK_SIZE);
      const partial = rem.kucukSapka % HAT_BLOCK_SIZE;
      html += `<div class="result-line"><span>${rem.kucukSapka} × Küçük Şapka</span><span>${fmt(hatBlockCost(rem.kucukSapka))} TL</span></div>`;
      if (full)    html += `<div class="result-line sub"><span>${full} tam blok (12'li)</span><span>${fmt(full * HAT_BLOCK_TOTAL)} TL</span></div>`;
      if (partial) html += `<div class="result-line sub"><span>${partial} adet (yeni blok)</span><span>${fmt(partialHatBlockCost(partial))} TL</span></div>`;
    }

    if (tarakSonuc.kalanKeci)  html += `<div class="result-line"><span>${tarakSonuc.kalanKeci} × Keçi Kılı Tarak</span><span>${fmt(tarakSonuc.kalanKeci * PRICES.keciKiliTarak)} TL</span></div>`;
    if (tarakSonuc.kalanBambu) html += `<div class="result-line"><span>${tarakSonuc.kalanBambu} × Bambu Tarak</span><span>${fmt(tarakSonuc.kalanBambu * PRICES.bambuTarak)} TL</span></div>`;
    if (state.kapiSusu)        html += `<div class="result-line"><span>${state.kapiSusu} × Kapı / Duvar Süsü</span><span>${fmt(kapiSusuCost)} TL</span></div>`;

    if (state.harfMagnet){
      const hb = harfMagnetBreakdown(state.harfMagnet);
      html += `<div class="result-line"><span>${state.harfMagnet} × Harf Magnet</span><span>${fmt(harfMagnetCost)} TL</span></div>`;
      if (hb.first) html += `<div class="result-line sub"><span>${hb.first} adet (ilk 6, 100 TL)</span><span>${fmt(hb.firstCost)} TL</span></div>`;
      if (hb.extra) html += `<div class="result-line sub"><span>${hb.extra} adet (7. harften itibaren, 70 TL)</span><span>${fmt(hb.extraCost)} TL</span></div>`;
    }

    if (state.ciftIsim) html += `<div class="result-line"><span>${state.ciftIsim} × Çift İsim</span><span>${fmt(ciftIsimCost)} TL</span></div>`;
  }

  html += `<div class="dashed"></div>`;
  html += `<div class="result-line sub"><span>Ara toplam</span><span>${fmt(araToplam)} TL</span></div>`;
  const diff = finalToplam - araToplam;
  if (diff !== 0) html += `<div class="result-line sub"><span>Yuvarlama</span><span>${diff > 0 ? '+' : ''}${fmt(diff)} TL</span></div>`;
  html += `<div class="grand"><span>TOPLAM</span><span>${fmt(finalToplam)} TL</span></div>`;

  box.innerHTML = html;
}

/* =========================================================
   10. MÜŞTERİ MESAJI OLUŞTURMA
   ========================================================= */

function buildMessage(result){
  const { anaSetSonuc, tarakSonuc, ciftIsimCost, kargoDahilToplam } = result;
  const lines = [];

  // Bir setin/otomatik setin içeriğini "  - 2 Ürün Adı" biçiminde, aralarında boş satırlarla ekler.
  // Sadece görüntü amaçlıdır; fiyatlandırmayı etkilemez.
  function pushContentLines(order, displayNames, requires, count){
    lines.push('');
    order.forEach(key => {
      const qty = (requires[key] || 0) * count;
      if (qty > 0) lines.push(`  - ${qty} ${displayNames[key]}`);
    });
    lines.push('');
  }

  const usedSets = anaSetSonuc.counts
    .map((c, i) => ({ c, name: SETS[i].name, price: SETS[i].price, requires: SETS[i].requires, contentOrder: SETS[i].contentOrder }))
    .filter(x => x.c > 0);

  const rem = anaSetSonuc.remaining;

  lines.push('🌸 Siparişiniz');
  lines.push('');

  usedSets.forEach(x => {
    lines.push(`• ${x.c} × ${x.name} — ${fmt(x.c * x.price)} TL`);
    pushContentLines(x.contentOrder, CONTENT_DISPLAY_NAMES, x.requires, x.c);
  });

  // Tarak Seti: Kese ürünle birlikte ücretsiz gelir, mesajda ürün adının parçası olarak tek satırda gösterilir.
  // Otomatik oluşturulan bu sette de aynı içerik gösterimi uygulanır.
  if (tarakSonuc.setSayisi > 0){
    lines.push(`• ${tarakSonuc.setSayisi} × ${TARAK_SET.name} + Kese — ${fmt(tarakSonuc.setSayisi * TARAK_SET.price)} TL`);
    pushContentLines(TARAK_SET_CONTENT_ORDER, TARAK_CONTENT_DISPLAY_NAMES, TARAK_SET.requires, tarakSonuc.setSayisi);
  }

  if (rem.tavsan)     lines.push(`• ${rem.tavsan} × Peluş Tavşan — ${fmt(rem.tavsan * PRICES.tavsan)} TL`);
  if (rem.yaka)       lines.push(`• ${rem.yaka} × Yaka — ${fmt(rem.yaka * PRICES.yaka)} TL`);
  if (rem.ciftYaka)   lines.push(`• ${rem.ciftYaka} × Çift Yaka — ${fmt(rem.ciftYaka * PRICES.ciftYaka)} TL`);
  if (rem.teddy)      lines.push(`• ${rem.teddy} × Teddy Peluş — ${fmt(rem.teddy * PRICES.teddy)} TL`);
  if (rem.buyukSapka) lines.push(`• ${rem.buyukSapka} × Büyük Şapka — ${fmt(rem.buyukSapka * PRICES.buyukSapka)} TL`);
  if (rem.kucukSapka) lines.push(`• ${rem.kucukSapka} × Küçük Şapka — ${fmt(hatBlockCost(rem.kucukSapka))} TL`);
  if (tarakSonuc.kalanKeci)  lines.push(`• ${tarakSonuc.kalanKeci} × Keçi Kılı Tarak + Kese — ${fmt(tarakSonuc.kalanKeci * PRICES.keciKiliTarak)} TL`);
  if (tarakSonuc.kalanBambu) lines.push(`• ${tarakSonuc.kalanBambu} × Bambu Tarak + Kese — ${fmt(tarakSonuc.kalanBambu * PRICES.bambuTarak)} TL`);
  if (state.kapiSusu)   lines.push(`• ${state.kapiSusu} × Kapı / Duvar Süsü — ${fmt(state.kapiSusu * PRICES.kapiSusu)} TL`);
  if (state.harfMagnet) lines.push(`• ${state.harfMagnet} × Harf Magnet — ${fmt(harfMagnetCost(state.harfMagnet))} TL`);
  if (state.ciftIsim)   lines.push(`• ${state.ciftIsim} × Çift İsim — ${fmt(ciftIsimCost)} TL`);

  lines.push('');
  lines.push('━━━━━━━━━━━━━━');
  lines.push('');
  lines.push(`📦 Kargo: ${fmt(SABIT_MESAJ.kargo)} TL`);
  lines.push('');
  lines.push(`💰 Kargo Dahil Toplam Tutar: ${fmt(kargoDahilToplam)} TL`);
  lines.push('');
  lines.push(`⏳ Hazırlık Süresi: ${SABIT_MESAJ.hazirlik}`);

  // Şartlı bilgi satırı: sepette en az 1 Çift İsim ürünü varsa gösterilir.
  if (state.ciftIsim > 0){
    lines.push('');
    lines.push(`🩷 ${SABIT_MESAJ.ciftIsimNotu}`);
  }

  lines.push('');
  lines.push('Teşekkür ederiz. 🤍');

  // Art arda gelen boş satırları (örn. bir set içeriğinin hemen ardından ayraç geldiğinde) tek satıra indirger.
  const collapsed = lines.filter((l, i) => !(l === '' && lines[i - 1] === ''));

  return collapsed.join('\n');
}

/* =========================================================
   11. TOAST BİLDİRİM
   ========================================================= */

let toastTimer = null;
function showToast(text){
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

/* =========================================================
   12. ANA YENİDEN HESAPLAMA DÖNGÜSÜ
   ========================================================= */

function recalc(){
  const result = optimizeAll(state);
  document.getElementById('totalAmount').innerHTML = `${fmt(result.finalToplam)} <span>TL</span>`;
  renderResult(result);
  document.getElementById('msgBox').textContent = buildMessage(result);
}

/* =========================================================
   13. OLAY DİNLEYİCİLERİ (Kopyala / Temizle / Yazdır)
   ========================================================= */

document.getElementById('btnCopy').addEventListener('click', () => {
  const text = document.getElementById('msgBox').textContent;
  const fallbackCopy = () => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { document.execCommand('copy'); showToast('Kopyalandı'); }
    catch (e) { showToast('Kopyalama başarısız'); }
    document.body.removeChild(ta);
  };

  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => showToast('Kopyalandı')).catch(fallbackCopy);
  } else {
    fallbackCopy();
  }
});

document.getElementById('btnPrint').addEventListener('click', () => window.print());

/* ---- Hazır Setler: sadece ürün adetlerine ekleme yapar, fiyat motorunu değiştirmez ---- */

const QUICK_SETS = {
  yasSeti:       { tavsan: 1, yaka: 1, kucukSapka: 1, buyukSapka: 1 },
  aylikSet:      { tavsan: 1, yaka: 1, buyukSapka: 1, kucukSapka: 12 },
  teddyYasSeti:  { teddy: 1, ciftYaka: 1, kucukSapka: 1, buyukSapka: 1 },
  teddyAylikSet: { teddy: 1, ciftYaka: 1, buyukSapka: 1, kucukSapka: 12 },
  tarakSeti:     { keciKiliTarak: 1, bambuTarak: 1 }
};

function addQuickSet(items){
  Object.keys(items).forEach(key => {
    state[key] = (state[key] || 0) + items[key];
  });
  renderProducts();
  recalc();
}

document.getElementById('qsYasSeti').addEventListener('click', () => addQuickSet(QUICK_SETS.yasSeti));
document.getElementById('qsAylikSet').addEventListener('click', () => addQuickSet(QUICK_SETS.aylikSet));
document.getElementById('qsTeddyYasSeti').addEventListener('click', () => addQuickSet(QUICK_SETS.teddyYasSeti));
document.getElementById('qsTeddyAylikSet').addEventListener('click', () => addQuickSet(QUICK_SETS.teddyAylikSet));
document.getElementById('qsTarakSeti').addEventListener('click', () => addQuickSet(QUICK_SETS.tarakSeti));

document.getElementById('btnClear').addEventListener('click', () => {
  PRODUCTS.forEach(p => state[p.id] = 0);
  renderProducts();
  recalc();
});

/* =========================================================
   14. BAŞLANGIÇ
   ========================================================= */

renderProducts();
recalc();
</script>
